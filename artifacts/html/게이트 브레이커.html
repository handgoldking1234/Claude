<title>게이트 브레이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbit&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#070A14; --panel:#0E1426; --line:#23304F; --text:#DCE6FF; --dim:#8494B8;
    --blue:#58C8FF; --violet:#9B6BFF; --gold:#FFD166; --red:#FF4D5E;
    color-scheme:dark;
  }
  html,body{background:var(--night);color:var(--text)}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;margin:0}
  .wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 28px;flex-wrap:wrap}
  .eyebrow{font-family:'Orbit',monospace;font-size:13px;color:var(--blue);letter-spacing:.08em;margin:0 0 6px}
  h1{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;font-size:52px;line-height:1;margin:0}
  h1 span{font-family:'Orbit',monospace;font-size:15px;color:var(--dim);letter-spacing:.3em;display:block;margin-top:6px}
  .lede{margin:0;max-width:48ch;color:var(--dim);font-size:15px;line-height:1.65;text-wrap:balance}
  .bar{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
  .bar button{font-family:inherit;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:3px;cursor:pointer;min-width:64px}
  .bar button[aria-pressed=false]{color:var(--dim)}
  .bar button:focus-visible,.bar input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .bar label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
  .bar input[type=range]{width:110px;accent-color:var(--blue)}
  .stage{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;background:#0A0E1C;border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 0 40px rgba(155,107,255,.12)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--dim)}
  .legend li{display:flex;align-items:center;gap:6px}
  .legend b{color:var(--text);font-weight:700}
  .legend .sk b{color:var(--blue)}
  kbd{font-family:'Orbit',ui-monospace,monospace;font-size:12px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;background:var(--panel);color:var(--text)}
  .touch{display:none;flex-direction:column;gap:10px;user-select:none;-webkit-user-select:none}
  .touch .line{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .touch button{font-family:inherit;touch-action:none;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:50%;width:58px;height:58px;font-size:14px;font-weight:700}
  .touch button.on{background:var(--blue);color:var(--night);border-color:var(--blue)}
  .touch .grp{display:flex;gap:8px;align-items:center}
  .touch .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
  .touch .pad button{width:52px;height:52px;border-radius:10px}
  .touch .pad [data-k=up]{grid-column:2;grid-row:1}
  .touch .pad [data-k=left]{grid-column:1;grid-row:2}
  .touch .pad [data-k=down]{grid-column:2;grid-row:2}
  .touch .pad [data-k=right]{grid-column:3;grid-row:2}
  .touch .acts{display:grid;grid-template-columns:repeat(3,auto);gap:8px;justify-items:center}
  .touch .big{width:70px;height:70px;font-size:16px;border-color:var(--blue)}
  .touch .kk{border-color:var(--gold);color:var(--gold)}
  .touch .skills button{border-radius:8px;width:62px;height:44px;font-size:13px}
  .touch .skills [data-k=q]{color:var(--gold)} .touch .skills [data-k=w]{color:#FF8A4C}
  .touch .skills [data-k=e]{color:var(--violet)} .touch .skills [data-k=r]{color:var(--blue)}
  @media (pointer:coarse){.touch{display:flex}.legend{display:none}}
  @media (max-width:520px){h1{font-size:42px}.touch button{width:50px;height:50px}.touch .big{width:60px;height:60px}.touch .pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)}.touch .pad button{width:46px;height:46px}.touch .skills button{width:54px}}

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">[시스템] 각성자 등록이 완료되었습니다</p>
      <h1>게이트 브레이커<span>GATE BREAKER</span></h1>
    </div>
    <p class="lede">서울 한복판에 게이트가 열렸습니다. 길 위를 누비며 마수를 띄우고 베어 콤보를 이으세요. 구역을 정리할 때마다 강화를 하나 고르고, 셋째 구역마다 던전 브레이크 보스가 나옵니다.</p>
  </header>

  <div class="bar" role="toolbar" aria-label="게임 설정">
    <button id="soundBtn" type="button" aria-pressed="true">소리 켬</button>
    <label for="vol">음량 <input id="vol" type="range" min="0" max="100" value="70"></label>
    <button id="shakeBtn" type="button" aria-pressed="true">흔들림 켬</button>
    <button id="pauseBtn" type="button">일시정지</button>
  </div>

  <div class="stage">
    <canvas id="game" tabindex="0" aria-label="게이트 브레이커 게임 화면"></canvas>
  </div>

  <div class="touch" id="touch" aria-label="터치 조작">
    <div class="line skills">
      <div class="grp">
        <button data-k="q">뇌격참</button><button data-k="w">화염파</button>
        <button data-k="e">분신</button><button data-k="r">천검</button>
      </div>
    </div>
    <div class="line">
      <div class="pad">
        <button data-k="up" aria-label="위">▲</button>
        <button data-k="left" aria-label="왼쪽">◀</button>
        <button data-k="down" aria-label="아래">▼</button>
        <button data-k="right" aria-label="오른쪽">▶</button>
      </div>
      <div class="acts">
        <button data-k="dash">섬광</button>
        <button data-k="jump">점프</button>
        <span></span>
        <button data-k="launch" class="kk">띄우기</button>
        <button data-k="attack" class="big">베기</button>

    </div>
  </div>

  <ul class="legend">
    <li><b>이동</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 방향키</li>
    <li><b>베기</b> <kbd>J</kbd> 길게 누르면 4연격</li>
    <li><b>띄우기</b> <kbd>K</kbd> 길게 모았다 떼면 올려베기 · 공중에서 내려찍기</li>
    <li><b>점프</b> <kbd>Space</kbd></li>
    <li><b>섬광보</b> <kbd>L</kbd> <kbd>Shift</kbd></li>
    <li class="sk"><b>스킬</b> <kbd>U</kbd> <kbd>I</kbd> <kbd>O</kbd> · 각성기 <kbd>R</kbd></li>
    <li><b>멈춤</b> <kbd>Esc</kbd></li>
  </ul>
</div>
<script>
(() => {
'use strict';
// 화면: 960x600 (위 540은 필드, 아래 60은 조작 안내 스트립)
const W = 960, H = 600, VH = 540, HORIZON = 372, FLOOR0 = 390, ZMAX = 138, ARENA = 2400, TAU = Math.PI * 2;
const NIGHT = '#0A0E1C', BLUE = '#58C8FF', VIOLET = '#9B6BFF', FIRE = '#FF7A3A', GOLD = '#FFD166', RED = '#FF4D5E', WHITE = '#EAF2FF', DIM = '#8494B8';
const GRAV = 1900, RUN = 270, RUNZ = 160, JUMP = 700, DASH = 800;
const F_SYS = "'Orbit','Noto Sans KR',sans-serif", F_TTL = "'Black Han Sans','Noto Sans KR',sans-serif", F_KR = "'Noto Sans KR',sans-serif";
const sy = z => FLOOR0 + z;
const dScale = z => 1.2 + z / ZMAX * 0.2;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
canvas.width = W * dpr; canvas.height = H * dpr;
try { ["30px 'Orbit'", "30px 'Black Han Sans'", "bold 16px 'Noto Sans KR'", "16px 'Noto Sans KR'"].forEach(f => document.fonts.load(f)); } catch (e) {}

// ---------- utils ----------
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : 1;

let best = 0;
try { best = parseInt(localStorage.getItem('gatebreaker-best') || '0', 10) || 0; } catch (e) {}
function saveBest(){ try { localStorage.setItem('gatebreaker-best', String(best)); } catch (e) {} }

// ---------- audio ----------
let AC = null, master = null, soundOn = true, volume = 0.7, shakeOn = true;
function audioOn(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); setVol(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function setVol(){ if (master) master.gain.value = soundOn ? volume : 0; }
function noise(dur, freq, q, gain, type){
  if (!AC || !soundOn) return;
  const len = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.value = gain;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
function tone(f0, f1, dur, type, gain, delay){
  if (!AC || !soundOn) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  slash: h => { noise(h ? 0.18 : 0.11, h ? 1800 : 2800, 1.2, 0.2); tone(h ? 900 : 1200, 400, 0.08, 'sine', 0.04); },
  launch: () => { noise(0.16, 1400, 1, 0.22); tone(300, 900, 0.18, 'triangle', 0.08); },
  charge: () => tone(200, 800, 0.4, 'sine', 0.05),
  ready: () => tone(1200, 1600, 0.08, 'square', 0.04),
  hit: () => { tone(180, 60, 0.12, 'triangle', 0.26); noise(0.06, 900, 1, 0.2); },
  soft: () => noise(0.05, 2200, 1, 0.08),
  kill: () => { tone(300, 60, 0.3, 'sawtooth', 0.08); noise(0.25, 600, 0.7, 0.18); },
  jump: () => tone(320, 620, 0.09, 'sine', 0.06),
  dash: () => { noise(0.14, 3000, 0.8, 0.14); tone(600, 1400, 0.1, 'sine', 0.05); },
  hurt: () => { tone(240, 70, 0.3, 'sawtooth', 0.12); noise(0.12, 500, 1, 0.2); },
  slam: () => { tone(90, 30, 0.35, 'sine', 0.45); noise(0.3, 200, 0.6, 0.35); },
  zap: () => { noise(0.25, 4000, 0.4, 0.3, 'highpass'); tone(1600, 80, 0.25, 'square', 0.06); },
  fire: () => { noise(0.4, 500, 0.5, 0.3); tone(200, 90, 0.35, 'sawtooth', 0.06); },
  clone: () => { tone(220, 440, 0.3, 'triangle', 0.1); tone(330, 660, 0.3, 'triangle', 0.08, 0.08); },
  ult: () => { tone(110, 55, 1.2, 'sawtooth', 0.12); noise(1.0, 1200, 0.4, 0.25); tone(880, 1760, 0.5, 'sine', 0.06, 0.2); },
  sword: () => noise(0.06, 3500, 1.5, 0.06),
  caw: () => tone(700, 380, 0.14, 'square', 0.04),
  wave: () => { tone(523, 523, 0.14, 'square', 0.05); tone(784, 784, 0.25, 'square', 0.05, 0.12); },
  alarm: () => { for (let i = 0; i < 3; i++) tone(880, 660, 0.22, 'square', 0.07, i * 0.3); },
  level: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, 'triangle', 0.1, i * 0.08)); },
  pick: () => { [659, 988, 1319].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.09, i * 0.06)); },
  pickup: () => tone(990, 1480, 0.1, 'sine', 0.08),
  over: () => tone(330, 110, 1.2, 'triangle', 0.15)
};

// ---------- settings bar ----------
const soundBtn = document.getElementById('soundBtn'), shakeBtn = document.getElementById('shakeBtn'), pauseBtn = document.getElementById('pauseBtn'), volIn = document.getElementById('vol');
function toggleSound(){ soundOn = !soundOn; soundBtn.textContent = soundOn ? '소리 켬' : '소리 끔'; soundBtn.setAttribute('aria-pressed', String(soundOn)); setVol(); }
soundBtn.addEventListener('click', () => { audioOn(); toggleSound(); canvas.focus(); });
volIn.addEventListener('input', () => { audioOn(); volume = volIn.value / 100; setVol(); });
shakeBtn.addEventListener('click', () => { shakeOn = !shakeOn; shakeBtn.textContent = shakeOn ? '흔들림 켬' : '흔들림 끔'; shakeBtn.setAttribute('aria-pressed', String(shakeOn)); canvas.focus(); });
pauseBtn.addEventListener('click', () => { togglePause(); canvas.focus(); });

// ---------- input ----------
const held = {}, pressed = new Set();
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  Space:'jump', KeyJ:'attack', KeyZ:'attack', KeyK:'launch', KeyX:'launch', KeyL:'dash', KeyC:'dash', ShiftLeft:'dash', ShiftRight:'dash',
  KeyU:'q', Digit1:'q', KeyI:'w', Digit2:'w', KeyO:'e', Digit3:'e', KeyR:'r', Digit4:'r',
  Enter:'start', Escape:'pause', KeyP:'pause', KeyM:'mute'
};
function press(a){
  audioOn();
  if (G.state === 'over' && G.overT < 1) return;
  if (a === 'mute') { toggleSound(); return; }
  if (G.state === 'upgrade') { upgradeInput(a); return; }
  if (a === 'pause') { togglePause(); return; }
  if (a === 'start') { if (G.state !== 'playing') start(); else if (G.paused) G.paused = false; return; }
  if (G.state !== 'playing') { if (a === 'attack' || a === 'jump') start(); return; }
  if (G.paused) { G.paused = false; return; }
  pressed.add(a); held[a] = true;
}
function release(a){ held[a] = false; }
window.addEventListener('keydown', e => {
  if (e.target === volIn) return;
  const a = KEYMAP[e.code]; if (!a) return;
  e.preventDefault(); if (e.repeat) return; press(a);
});
window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
window.addEventListener('blur', () => { for (const k in held) held[k] = false; if (G.state === 'playing') G.paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'playing') G.paused = true; });
canvas.addEventListener('pointerdown', e => {
  audioOn(); canvas.focus();
  const r = canvas.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
  if (G.state === 'upgrade') { const i = cardAt(px, py); if (i >= 0) { if (G.upSel === i) chooseUpgrade(i); else G.upSel = i; } return; }
  if (G.state === 'over' && G.overT < 1) return;
  if (G.state !== 'playing') start(); else if (G.paused) G.paused = false;
});
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('on'); press(k); try { b.setPointerCapture(e.pointerId); } catch (_) {} };
  const up = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ---------- city art (pre-rendered) ----------
function makeLayer(w, draw){
  const c = document.createElement('canvas'); c.width = Math.ceil(w * dpr); c.height = VH * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); draw(g, w); return { c, w };
}
const SIGN_WORDS = ['노래방', '치킨', 'PC방', '편의점', '약국', '24시', '호프', '헬스', '카페', '김밥', '당구장', '곱창', '분식', '헌터협회'];
const NEON_COLS = ['#FF4FA3', '#58C8FF', '#7CFFB2', '#FFB347', '#C08BFF', '#FF5E5E'];
function neonSign(g, x, y, text, col, vertical, size){
  g.save();
  g.font = `700 ${size}px ${F_KR}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const ch = [...text];
  const w = vertical ? size + 12 : g.measureText(text).width + 18, h = vertical ? ch.length * (size + 3) + 12 : size + 14;
  // 벽에 번지는 빛
  const halo = g.createRadialGradient(x + w / 2, y + h / 2, 4, x + w / 2, y + h / 2, Math.max(w, h) * 1.2);
  halo.addColorStop(0, col + '40'); halo.addColorStop(1, col + '00');
  g.fillStyle = halo; g.fillRect(x - w, y - h * 0.6, w * 3, h * 2.2);
  g.fillStyle = 'rgba(8,6,16,0.92)'; g.fillRect(x, y, w, h);
  g.shadowColor = col; g.shadowBlur = 12; g.strokeStyle = col; g.lineWidth = 1.6; g.strokeRect(x + 2.5, y + 2.5, w - 5, h - 5);
  g.fillStyle = col;
  if (vertical) ch.forEach((c, i) => g.fillText(c, x + w / 2, y + 7 + size / 2 + i * (size + 3) + 1));
  else g.fillText(text, x + w / 2, y + h / 2 + 1);
  g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,0.55)';
  if (vertical) ch.forEach((c, i) => g.fillText(c, x + w / 2, y + 7 + size / 2 + i * (size + 3) + 1)); else g.fillText(text, x + w / 2, y + h / 2 + 1);
  g.restore();
  return { w, h };
}
function skyline(g, w, seed, base, minH, maxH, col, rim, winA, winCols, density, onB){
  const r = rng(seed); let x = -20;
  while (x < w + 20) {
    const bw = 44 + r() * 96, bh = minH + r() * (maxH - minH), top = base - bh;
    const bg = g.createLinearGradient(0, top, 0, base);
    bg.addColorStop(0, col[0]); bg.addColorStop(1, col[1]);
    g.fillStyle = bg; g.fillRect(x, top, bw, bh + 200);
    // 게이트 쪽 림라이트
    g.fillStyle = rim; g.fillRect(x, top, bw, 1.5); g.fillRect(x + bw - 1.5, top, 1.5, bh * 0.6);
    g.fillStyle = col[0];
    if (r() < 0.3) { g.fillRect(x + bw * 0.4, top - 26 - r() * 30, 3, 50); g.fillStyle = '#FF3B3B'; g.fillRect(x + bw * 0.4 - 1, top - 30 - r() * 26, 5, 3); g.fillStyle = col[0]; }
    if (r() < 0.25) { g.fillRect(x + bw * 0.15, top - 14, bw * 0.3, 14); }
    if (r() < 0.2) { g.clearRect(x + bw * 0.6, top - 1, bw * 0.4 + 1, 14 + r() * 30); }
    for (let wy = top + 10; wy < base - 8; wy += 12) for (let wx = x + 6; wx < x + bw - 8; wx += 10) {
      if (r() < density) { g.fillStyle = winCols[Math.floor(r() * winCols.length)]; g.globalAlpha = winA * (0.35 + r() * 0.65); g.fillRect(wx, wy, 5, 6); g.globalAlpha = 1; }
    }
    if (onB) onB(g, x, top, bw, bh, r);
    x += bw + r() * 12;
  }
}
let layers = [];
function buildLayers(){
  layers = [];
  layers.push({ f: 0.03, L: makeLayer(W + (ARENA - W) * 0.03 + 40, (g, w) => {
    const gr = g.createLinearGradient(0, 0, 0, VH); gr.addColorStop(0, '#03040B'); gr.addColorStop(0.4, '#110D2C'); gr.addColorStop(0.68, '#2C1650'); gr.addColorStop(1, '#3B1A55');

function startMove(id){

    if (Math.abs(e.z - p.z) > m.zr + (e.type === 'boss' ? 14 : 0)) return false;

function enemyPhysics(e, dt){
  if (e.h > 0 || e.vh > 0) {
    e.vh -= GRAV * (e.air && e.juggle > 0 ? 0.8 : 1) * dt;
    e.h += e.vh * dt; e.x += e.vx * dt; e.vx *= 0.99;
    if (e.h <= 0) landEnemy(e);
  } else {
    e.x += e.vx * dt; e.vx *= Math.max(0, 1 - dt * 8);
  }
  e.z = clamp(e.z + e.vz * dt, 0, ZMAX);
  e.x = clamp(e.x, 10, ARENA - 10);
}
function landEnemy(e){
  e.h = 0;
  if (e.spiked) {
    e.spiked = false; e.vh = 240; e.h = 0.1; e.bounced = true;
    shake(8); burst(e.x, e.z, 2, 16, 0, BLUE, 360); addDecal(e.x, e.z, true); smoke(e.x, e.z, 0, 5, 20);
    parts.push({ type: 'wave', x: e.x, y: sy(e.z), life: 0.35, max: 0.35, c: VIOLET });
    return;
  }
  if (e.air) {
    if (!e.bounced && e.vh < -380) { e.vh = -e.vh * 0.3; e.h = 0.1; e.bounced = true; smoke(e.x, e.z, 0, 2, 10); return; }
    e.air = false; e.vh = 0; e.juggle = 0; e.bounced = false;
    e.downT = e.type === 'garg' ? 0.5 : 0.75; e.vx *= 0.3;
    addDecal(e.x, e.z, false); smoke(e.x, e.z, 0, 3, 16);
    return;
  }
  if (e.type === 'slime' && e.vh < -300) addDecal(e.x, e.z, false);
  e.vh = 0;
}
function updateEnemy(e, dt){
  const dx = P.x - e.x, dz = P.z - e.z;
  e.hurt = Math.max(0, e.hurt - dt); e.anim += dt; e.touchCd = Math.max(0, e.touchCd - dt);
  if (e.burn > 0) {
    e.burn -= dt; e.burnTick -= dt;
    if (Math.random() < 0.5) parts.push({ type: 'ember', x: e.x + rand(-e.w, e.w), y: sy(e.z) - e.h - rand(0, e.tall), vx: rand(-20, 20), vy: rand(-90, -40), r: rand(1.5, 3), life: 0.5, max: 0.5, c: FIRE });
    if (e.burnTick <= 0) { e.burnTick = 0.4; dealDamage(e, 0.35 * S.burn, 0, { noKb: true, silent: true, color: FIRE, noCrit: true, gain: 1 }); if (e.dead) return; }
  }
  if (e.stun > 0) e.stun -= dt;
  if (e.downT > 0) { e.downT -= dt; if (e.downT <= 0 && e.type === 'garg') { e.h = 1; e.vh = 200; e.state = 'rise'; } }

  if (e.type === 'slime') {
    if (!busy && e.h <= 0) {
      e.facing = sign(dx); e.t -= dt;
      if (e.t <= 0) { e.vx = sign(dx) * rand(110, 180); e.vz = clamp(dz * 2, -80, 80); e.vh = rand(300, 420); e.t = rand(0.6, 1.2); }
      else e.vz *= 0.8;
    } else if (e.h <= 0) e.vz *= 0.8;
    enemyPhysics(e, dt);
  } else if (e.type === 'garg') {
    if (e.air || e.downT > 0) { enemyPhysics(e, dt); }
    else {
      if (e.stun > 0) { e.vx *= 0.95; e.vz *= 0.9; }
      else if (e.state === 'hover') {
        const tx = P.x + e.side * 160, th = 125 + Math.sin(G.time * 2 + e.seed) * 20;
        e.vx = lerp(e.vx, clamp((tx - e.x) * 2.2, -210, 210), dt * 4);
        e.vz = lerp(e.vz, clamp(dz * 2, -90, 90), dt * 4);
        e.vh = lerp(e.vh, clamp((th - e.h) * 2.5, -170, 170), dt * 4);
        e.t -= dt;
        if (e.t <= 0 && Math.abs(dx) < 340) { e.state = 'aim'; e.t = 0.42; sfx.caw(); }
      } else if (e.state === 'aim') {
        e.vx *= 0.85; e.vz *= 0.85; e.vh = lerp(e.vh, 40, dt * 5); e.t -= dt;
        if (e.t <= 0) { const dh = (P.h + 20) - e.h, len = Math.hypot(dx, dz * 2, dh) || 1; e.vx = dx / len * 520; e.vz = dz * 2 / len * 520 * 0.5; e.vh = dh / len * 520; e.state = 'dive'; e.t = 0.9; }
      } else if (e.state === 'dive') {
        e.t -= dt; if (e.h <= 14 || e.t <= 0) { e.state = 'rise'; e.t = 0.8; }
      } else if (e.state === 'rise') {
        e.vh = lerp(e.vh, 230, dt * 5); e.vx *= 0.97; e.vz *= 0.95; e.t -= dt;
        if (e.t <= 0 || e.h > 125) { e.state = 'hover'; e.t = rand(1.3, 2.6); e.side = -e.side; }
      }
      e.x = clamp(e.x + e.vx * dt, 10, ARENA - 10); e.z = clamp(e.z + e.vz * dt, 0, ZMAX); e.h = clamp(e.h + e.vh * dt, 6, 190);
      if (Math.abs(e.vx) > 20) e.facing = sign(e.vx);
    }
  } else {
    const boss = e.type === 'boss', reach = boss ? 190 : 140;
    e.cd -= dt; if (boss) e.roar -= dt;
    if (e.air || e.downT > 0) { enemyPhysics(e, dt); }
    else {
      if (e.state === 'walk') {
        e.facing = sign(dx);
        const tx = P.x - sign(dx) * (boss ? 140 : 100);
        const spd = boss ? 70 : 56;
        if (e.stun <= 0) { e.vx = lerp(e.vx, clamp((tx - e.x) * 2, -spd, spd), dt * 4); e.vz = lerp(e.vz, clamp(dz * 2, -50, 50), dt * 4); }
        if (boss && e.roar <= 0) { e.state = 'roar'; e.t = 1.0; e.roar = rand(8, 11); }
        else if (Math.abs(dx) < reach && Math.abs(dz) < (boss ? 34 : 24) && e.cd <= 0 && e.stun <= 0) { e.state = 'wind'; e.t = boss ? 0.7 : 0.62; e.wmax = e.t; }
      } else if (e.state === 'roar') {
        e.vx *= 0.8; e.vz *= 0.8; e.t -= dt; shake(3);
        if (e.t <= 0) { e.state = 'walk'; for (let i = 0; i < 2; i++) spawnEnemy('slime'); sys('[경고] 오우거 로드가 마수를 소환했습니다', RED); }
      } else if (e.state === 'wind') {
        e.vx *= Math.max(0, 1 - dt * 8); e.vz *= 0.8; e.t -= dt;
        if (e.t <= 0) {
          e.state = 'slam'; e.t = 0.22; e.didHit = false; sfx.slam(); shake(boss ? 16 : 10);
          const sx = e.x + e.facing * (boss ? 140 : 90);
          burst(sx, e.z, 4, 16, 0, boss ? RED : VIOLET, 380); addDecal(sx, e.z, true); smoke(sx, e.z, 0, 10, 50);
          parts.push({ type: 'wave', x: sx, y: sy(e.z), life: 0.4, max: 0.4, c: boss ? RED : VIOLET });
          if (boss) for (const d of [-1, 1]) eprojs.push({ x: sx, z: e.z, vx: d * 430, life: 2.4, dmg: e.dmg * 0.7 });
        }
      } else if (e.state === 'slam') {
        e.t -= dt;
        if (!e.didHit) { e.didHit = true; const w = boss ? 240 : 150; const d2 = (P.x - e.x) * e.facing; if (d2 > -20 && d2 < w && Math.abs(P.z - e.z) < (boss ? 40 : 30) && P.h < (boss ? 150 : 90)) hurtPlayer(e.x, e.dmg); }
        if (e.t <= 0) { e.state = 'recover'; e.t = boss ? 0.55 : 0.7; }
      } else if (e.state === 'recover') {
        e.vx *= 0.9; e.t -= dt; if (e.t <= 0) { e.state = 'walk'; e.cd = boss ? 0.9 : 1.3; }
      }
      enemyPhysics(e, dt);
    }
  }
  // 접촉 피해 (슬라임, 가고일)
  if ((e.type === 'slime' || e.type === 'garg') && !busy && e.touchCd <= 0 && Math.abs(dx) < e.w + 10 && Math.abs(dz) < 16 && P.h < e.h + e.tall && P.h + P.tall > e.h) { e.touchCd = 1; hurtPlayer(e.x, e.dmg); }
}
function separate(){
  for (let i = 0; i < enemies.length; i++) for (let j = i + 1; j < enemies.length; j++) {
    const a = enemies[i], b = enemies[j];
    if (a.air || b.air) continue;
    const dx = b.x - a.x, dz = b.z - a.z, mx = (a.w + b.w) * 0.8;
    if (Math.abs(dx) < mx && Math.abs(dz) < 14) { const push = (mx - Math.abs(dx)) * 0.5 * sign(dx || Math.random() - 0.5); a.x -= push * 0.5; b.x += push * 0.5; a.z = clamp(a.z - sign(dz) * 0.5, 0, ZMAX); b.z = clamp(b.z + sign(dz) * 0.5, 0, ZMAX); }
  }
}

// ---------- skills / projectiles ----------

      const vis = enemies.filter(e => !e.dead && e.x > G.camX && e.x < G.camX + W);
      let x, z;
      if (vis.length && Math.random() < 0.6) { const e = vis[Math.floor(Math.random() * vis.length)]; x = e.x + rand(-16, 16); z = e.z + rand(-8, 8); }
      else { x = rand(G.camX + 30, G.camX + W - 30); z = rand(0, ZMAX); }

      s.stuck = 0.45; s.y = sy(s.z);
      for (const e of enemies) if (!e.dead && Math.abs(e.x - s.x) < 34 + e.w && Math.abs(e.z - s.z) < 26 && e.h < 140) dealDamage(e, 1.1, sign(e.x - s.x), { color: BLUE, noHitstop: true, silent: true, stun: 0.2, gain: 0, move: { keep: 200 } });

// ---------- step ----------
function step(dt){
  G.time += dt;
  G.shake = Math.max(0, G.shake - dt * 40);
  G.flash = Math.max(0, G.flash - dt); G.redFlash = Math.max(0, G.redFlash - dt);
  for (const m of motes) { m.y -= m.v * dt; m.p += dt; if (m.y < -5) { m.y = VH + 5; m.x = Math.random() * W; } }
  for (const d of rain) { d.y += d.v * dt; d.x -= d.v * 0.25 * dt; if (d.y > VH) { d.y = -20; d.x = Math.random() * (W + 200); } }
  G.zoom = lerp(G.zoom, 1, Math.min(1, dt * 4));
  if (G.state === 'upgrade') { G.upT += dt; updateParts(dt); return; }
  if (!G.paused) for (let i = 0; i < 2; i++) parts.push({ type: 'splash', x: G.camX + Math.random() * W, y: FLOOR0 + rand(0, ZMAX + 10), life: 0.25, max: 0.25 });
  P.hpLag = P.hpLag > P.hp ? Math.max(P.hp, P.hpLag - dt * 40) : P.hp;
  if (G.boss) G.boss.hpLag = G.boss.hpLag > G.boss.hp ? Math.max(G.boss.hp, G.boss.hpLag - dt * 220) : G.boss.hp;
  if (G.state === 'title') { G.camX = (Math.sin(G.time * 0.08) * 0.5 + 0.5) * (ARENA - W); updateParts(dt); return; }
  if (G.state === 'over') { G.overT += dt; updateParts(dt); return; }
  if (G.paused) return;
  if (G.hitstop > 0) { G.hitstop -= dt; return; }

  updatePlayer(dt);
  for (const e of enemies) if (!e.dead) updateEnemy(e, dt);
  separate();
  updateSkills(dt);
  enemies = enemies.filter(e => !e.dead);

  // 차례/구역 진행
  if (G.stageClearT > 0) { G.stageClearT -= dt; if (G.stageClearT <= 0) offerUpgrades(); }
  else if (G.breakT > 0) { G.breakT -= dt; if (G.breakT <= 0) startWave(); }
  else if (G.wave > 0) {
    if (G.toSpawn > 0) {
      G.spawnT -= dt;
      if (G.spawnT <= 0 && enemies.length < 2 + G.stage + 1) { spawnEnemy(); G.toSpawn--; G.spawnT = Math.max(0.5, 1.3 - G.stage * 0.08); }
    } else if (enemies.length === 0 && !timers.length) {
      if (G.wave >= 4) {
        const bonus = G.stage * 600; G.score += bonus;
        banner('STAGE CLEAR', `구역 정리 완료 · 보상 +${bonus} · 강화를 하나 고르세요`, '#6DFFB0', 1.8);
        G.stageClearT = 1.8; sfx.level();
      } else {
        G.breakT = 1.6; const bonus = G.wave * 100 * G.stage; G.score += bonus;
        sys(`[시스템] ${G.wave}/4 차례 정리 · +${bonus}`, '#6DFFB0');
        P.mp = Math.min(P.maxMp, P.mp + 25);
      }
    }
  }
  G.bannerT = Math.max(0, G.bannerT - dt);
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) { if (G.combo >= 10) sys(`콤보 종료 — ${G.combo} HIT`, DIM); G.combo = 0; } }
  if (G.stage === 1) { G.tipT += dt; if (G.tipT > 6) { G.tipT = 0; G.tipI = (G.tipI + 1) % TIPS.length; } }
  for (const k of pickups) {
    k.t += dt; k.life -= dt; k.vh -= GRAV * 0.6 * dt; k.h += k.vh * dt; k.x += k.vx * dt; k.vx *= 0.98;
    if (k.h <= 0) { k.h = 0; k.vh = Math.abs(k.vh) > 120 ? -k.vh * 0.35 : 0; k.vx *= 0.8; }
    const dx = P.x - k.x, dz = P.z - k.z;
    if (k.t > 0.6 && Math.hypot(dx, dz * 2) < 110) { k.x += dx * dt * 6; k.z += dz * dt * 6; }
  }

  const target = clamp(P.x - W / 2 + P.facing * 70, 0, ARENA - W);
  G.camX = lerp(G.camX, target, Math.min(1, dt * 5));
  updateParts(dt);
}
function updateParts(dt){
  for (const q of parts) {
    q.life -= dt;
    if (q.type === 'spark') { q.vy += GRAV * 0.55 * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.fy && q.y > q.fy) { q.y = q.fy; q.vy *= -0.3; q.vx *= 0.6; } }
    else if (q.type === 'ember') { q.x += q.vx * dt; q.y += q.vy * dt; }
    else if (q.type === 'ring') q.r += dt * 240;
    else if (q.type === 'smoke') { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.r += dt * 26; }
    else if (q.type === 'bit') { q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 60 * dt; }
  }
  parts = parts.filter(q => q.life > 0);
  if (parts.length > 700) parts.splice(0, parts.length - 700);
  for (const t of texts) { t.life -= dt; t.y -= dt * t.vy; t.vy *= 0.94; }
  texts = texts.filter(t => t.life > 0);
  for (const s of sysLog) s.life -= dt;
  sysLog = sysLog.filter(s => s.life > 0);
}
let REFL = false, LOWQ = false;               // 도로 반사 패스 중이면 true (그림자 효과 생략)
function glow(col, blur){ ctx.shadowColor = col; ctx.shadowBlur = REFL || LOWQ ? 0 : blur; }
const PAL_HERO = { top: '#3A4C7A', bot: '#080B16', trim: BLUE, lining: '#1F4E86', skin: '#C9D4EE' };
const PAL_CLONE = { top: '#5B3AA0', bot: '#10061F', trim: VIOLET, lining: '#6B3FD0', skin: '#D8C8FF' };

  txt('[ 시스템 알림 ]', W / 2, by + 32, 16, BLUE, 'center');
  txt('당신은 각성자의 자격을 얻었습니다.', W / 2, by + 64, 16, WHITE, 'center', F_KR);
  txt('게이트가 열렸습니다. 도시를 지키시겠습니까?', W / 2, by + 88, 16, WHITE, 'center', F_KR);
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(G.time * 4);
  txt('[ 수락 ]  Enter · J · 화면 터치', W / 2, by + 126, 15, GOLD, 'center', F_KR); ctx.globalAlpha = 1;
  if (best > 0) txt(`최고 기록 ${best.toLocaleString()}`, W / 2, by + 172, 13, DIM, 'center', F_KR);
}
function drawOver(){
  const a = Math.min(1, G.overT * 1.5);
  ctx.fillStyle = `rgba(4,2,8,${0.75 * a})`; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const bw = 480, bx = (W - bw) / 2, by = 110;
  sysBox(bx, by, bw, 300, RED);
  txt('[ 시스템 ]', W / 2, by + 34, 15, RED, 'center');
  ctx.save(); ctx.shadowColor = RED; ctx.shadowBlur = 20; txt('헌터 사망', W / 2, by + 90, 52, WHITE, 'center', F_TTL); ctx.restore();
  txt('생명 신호가 소멸했습니다.', W / 2, by + 118, 14, '#C9D4EE', 'center', F_KR);
  const rank = rankOf(P.lvl);
  const rows = [['최종 등급', `Lv.${P.lvl} · ${rank}급`], ['도달 구역', `${String(G.stage).padStart(2, '0')} · ${G.wave}/4 차례`], ['처치 / 최대 콤보', `${G.kills}체 / ${G.maxCombo} HIT`], ['강화', `${Object.values(G.ups).reduce((s, v) => s + v, 0)}개`], ['점수', G.score.toLocaleString() + (G.newBest ? '  · 신기록' : '')]];
  rows.forEach((r, i) => { txt(r[0], bx + 70, by + 156 + i * 24, 14, DIM, 'left', F_KR); txt(r[1], bx + bw - 70, by + 156 + i * 24, 14, i === 4 && G.newBest ? GOLD : WHITE, 'right', F_KR); });
  if (G.overT > 1) txt('[ 재각성 ]  Enter · 화면 터치', W / 2, by + 284, 14, GOLD, 'center', F_KR);
  ctx.globalAlpha = 1;
}

// ---------- loop ----------
const perf = { t: 0, n: 0 };
let last = performance.now(), acc = 0; const STEP = 1 / 60;
function frame(now){
  let d = (now - last) / 1000; last = now; if (d > 0.1) d = 0.1;
  if (!document.hidden) { perf.t += d; perf.n++; if (perf.t > 2) { if (perf.t / perf.n > 0.026) LOWQ = true; perf.t = 0; perf.n = 0; } }
  acc += d;
  while (acc >= STEP) { step(STEP); acc -= STEP; pressed.clear(); }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
