<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>잿빛 전선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed battlefield canvas, slim resource strip on top, command console docked at the bottom */
:root{
  --void:#0b0d10; --panel:#13171b; --panel2:#1a2026; --line:#2a333b; --ink:#dbe3e6; --dim:#7d8a92;
  --ally:#3fd6c6; --hostile:#ff4f6d; --crystal:#8fd8ff; --warn:#ffb547; --acid:#c6f04a;
  --f-display:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--void)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--ally);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}

/* top strip */
#top{display:flex;align-items:center;gap:20px;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;color:var(--ink);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:10px;background:var(--hostile);transform:rotate(45deg);box-shadow:0 0 10px var(--hostile)}
.res{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.res b{font-family:var(--f-mono);font-weight:600;font-size:16px}
.res small{font-size:11px;color:var(--dim);letter-spacing:.06em}
.res .ico{width:10px;height:10px;align-self:center;display:inline-block}
.ico.cry{background:var(--crystal);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ico.sup{border:2px solid var(--ally);border-radius:2px}
.res.warn b{color:var(--warn)}
.res.short b{color:var(--hostile)}
.spacer{flex:1}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer}
.tb:hover{border-color:var(--dim)}
.tb b{font-family:var(--f-mono);color:var(--ally)}

/* stage */
#stage{position:relative;min-height:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#toasts{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92%,520px)}
.toast{background:rgba(11,13,16,.82);border:1px solid var(--line);border-left:3px solid var(--ally);padding:6px 12px;font-size:13px;border-radius:3px;animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--hostile)}
.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{transform:translateY(-6px);opacity:.3}}
#boxBtn{position:absolute;left:12px;bottom:12px;display:none;background:rgba(19,23,27,.9);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12px}
#boxBtn.on{border-color:var(--ally);color:var(--ally)}
@media (pointer:coarse){#boxBtn{display:block}}

/* overlay */
#overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 70% 20%,rgba(255,79,109,.10),transparent 60%),rgba(8,10,12,.72);overflow-y:auto}
#overlay[hidden]{display:none!important}
.brief{width:min(100%,640px);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px 28px 24px;display:grid;gap:18px;position:relative}
.brief::before{content:"";position:absolute;left:0;top:0;width:64px;height:3px;background:var(--hostile)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--hostile);text-transform:uppercase}
.brief h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
.brief p{margin:0;line-height:1.7;color:#b7c2c7;max-width:62ch;font-size:14px}
.brief p b{color:var(--ink)}
.diff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diff button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:left;cursor:pointer;display:grid;gap:3px}
.diff button span{font-weight:700;font-size:14px}
.diff button small{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.diff button[aria-pressed="true"]{border-color:var(--ally);box-shadow:inset 0 0 0 1px var(--ally)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;font-size:12px;color:var(--dim)}
.keys div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.keys kbd{font-family:var(--f-mono);color:var(--ink);font-size:11px}
.go{justify-self:start;background:var(--ally);color:#06201d;border:0;border-radius:4px;padding:12px 26px;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.04em}
.go:hover{filter:brightness(1.1)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--panel2);border-radius:4px;padding:10px;display:grid;gap:2px}
.stats b{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--dim)}
.win h1{color:var(--ally)} .lose h1{color:var(--hostile)}

/* HUD */
#hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"mini info cmd";gap:14px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);height:150px}
#miniWrap{grid-area:mini;border:1px solid var(--line);background:#000;align-self:start;line-height:0}
#mini{width:186px;height:128px;display:block;touch-action:none;cursor:pointer}
#info{grid-area:info;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:6px;font-size:13px}
#cmd{grid-area:cmd;display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,40px);gap:5px;align-self:start}
.cb{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:3px;font-size:11.5px;line-height:1.15;padding:3px 4px 2px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cb:hover:not(:disabled){border-color:var(--ally)}
.cb:disabled{opacity:.38;cursor:not-allowed}
.cb .k{position:absolute;right:3px;top:2px;font-family:var(--f-mono);font-size:9.5px;color:var(--ally)}
.cb .c{font-family:var(--f-mono);font-size:10px;color:var(--crystal)}
.cb.poor .c{color:var(--hostile)}
.cb.hot{border-color:var(--warn);color:var(--warn)}
.cb.empty{visibility:hidden}
.iname{display:flex;align-items:baseline;gap:10px}
.iname b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.02em}
.iname span{font-size:12px;color:var(--dim)}
.iname .foe{color:var(--hostile)}
.hpb{height:6px;background:#0a0c0e;border-radius:3px;overflow:hidden;max-width:300px}
.hpb i{display:block;height:100%;background:var(--ally)}
.istat{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.istat b{color:var(--ink);font-family:var(--f-mono);font-weight:400}
.queue{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.qi{width:34px;height:30px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;font-size:11px;background:var(--panel2);cursor:pointer;position:relative;overflow:hidden}
.qi i{position:absolute;left:0;bottom:0;height:3px;background:var(--ally)}
.chips{display:flex;flex-wrap:wrap;gap:4px;overflow:hidden;max-height:92px}
.chip{width:34px;height:28px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);display:grid;place-items:center;font-size:11px;position:relative;cursor:pointer;overflow:hidden}
.chip i{position:absolute;left:0;bottom:0;height:3px}
.tip{color:var(--dim);font-size:12.5px;line-height:1.6;max-width:60ch}
.tip b{color:var(--ink);font-weight:500}
.tip kbd{font-family:var(--f-mono);font-size:11px;color:var(--ally)}

@media (max-width:700px){
  #top{gap:14px;padding:6px 12px}
  .brand{font-size:16px} .brand span{display:none}
  .res small{display:none}
  #hud{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"mini cmd" "info info";grid-template-rows:auto auto;height:auto;gap:8px;padding:8px 12px}
  #mini{width:128px;height:88px}
  #cmd{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,27px);gap:3px;justify-self:stretch}
  .cb{font-size:10.5px;flex-direction:row;align-items:center;gap:4px;padding:2px 4px}
  .cb .k{display:none}
  #info{height:38px;flex-direction:row;align-items:center;gap:10px}
  .iname b{font-size:16px}
  .istat,.tip{font-size:11px}
  .tip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{max-height:30px}
  .hpb{width:80px}
  .brief{padding:22px 18px}
  .keys{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .diff button small{font-size:10px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div id="app">
  <header id="top">
    <div class="brand"><i></i><span>잿빛 전선</span></div>
    <div class="res" id="resMoney"><span class="ico cry"></span><b id="rMoney">0</b><small>결정</small></div>
    <div class="res" id="resSup"><span class="ico sup"></span><b id="rSup">0/0</b><small>보급</small></div>

    <div class="spacer"></div>
    <button id="idleBtn" class="tb" type="button">유휴 작업기 <b id="idleN">0</b></button>
    <button id="muteBtn" class="tb" type="button">소리 켬</button>
    <button id="pauseBtn" class="tb" type="button">일시정지</button>
    <button id="helpBtn" class="tb" type="button">조작법</button>
  </header>
  <main id="stage">
    <canvas id="view" aria-label="전장"></canvas>
    <div id="toasts" aria-live="polite"></div>
    <button id="boxBtn" type="button">드래그: 화면 이동</button>
    <div id="overlay"></div>
  </main>
  <footer id="hud">
    <div id="miniWrap"><canvas id="mini" aria-label="미니맵"></canvas></div>
    <div id="info"></div>
    <div id="cmd"></div>
  </footer>
</div>

// ---------- utils ----------
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const isB=e=>!!DEF[e.type].b, isU=e=>!!DEF[e.type].u;
const rad=e=>e.type==='crystal'?16:DEF[e.type].u?DEF[e.type].r:e.size/2;
const alive=e=>e&&!e.dead&&e.hp>0;
const hostile=(a,b)=>a.team>=0&&b.team>=0&&a.team!==b.team;
const cellI=(x,y)=>clamp(y/CELL|0,0,GH-1)*GW+clamp(x/CELL|0,0,GW-1);
const visAt=(x,y)=>visible[cellI(x,y)]===1;
const fmtT=s=>{s=Math.max(0,Math.floor(s));return (s/60|0)+':'+String(s%60).padStart(2,'0')};
function distRect(x,y,b){const h=b.size/2;const dx=Math.max(Math.abs(x-b.x)-h,0),dy=Math.max(Math.abs(y-b.y)-h,0);return Math.hypot(dx,dy)}
function gap(a,b){
  if(isB(b)) return distRect(a.x,a.y,b)-(isB(a)?a.size*.45:rad(a));
  if(isB(a)) return distRect(b.x,b.y,a)-rad(b);
  return Math.hypot(a.x-b.x,a.y-b.y)-rad(a)-rad(b);
}
function turn(a,b,k){let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+clamp(d,-k,k)}
function canSee(team,e){return team===1||e.team===0||(isB(e)?G.explored[cellI(e.x,e.y)]===1:visAt(e.x,e.y))}

// ---------- world setup ----------
function spawn(type,team,x,y,built=true){
  const d=DEF[type];
  const e={id:G.nextId++,type,team,x,y,hp:d.hp||1,face:team===1?Math.PI*.75:-Math.PI*.25,cd:0,order:null,tgt:0};
  if(d.b){e.size=d.size;e.built=built;e.prog=built?1:0;e.queue=[];e.qprog=0;e.rally=null;if(!built)e.hp=Math.max(1,d.hp*.1)}
  if(type==='crystal'){e.team=-1;e.amount=1500;e.max=1500}
  if(d.u){e.carry=0;e.r=d.r}
  G.ents.push(e);byId.set(e.id,e);return e;
}
function field(cx,cy,ang,n,amt){
  for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*.24, dd=190+(i%2)*30;const c=spawn('crystal',-1,cx+Math.cos(a)*dd,cy+Math.sin(a)*dd);c.amount=c.max=amt}
}
function cluster(cx,cy,n,amt,seed){
  const R=rng(seed);
  for(let i=0;i<n;i++){const a=i/n*TAU+R()*.4, dd=34+R()*30;const c=spawn('crystal',-1,cx+Math.cos(a)*dd,cy+Math.sin(a)*dd);c.amount=c.max=amt}
}
function newGame(diff){
  G={t:0,diff,money:200,mined:0,nextId:1,ents:[],explored:new Array(GW*GH).fill(0),
     ai:{money:0,tick:0,next:DIFF[diff].first,wave:0,scouted:diff===0},
     stats:{killed:0,lost:0,trained:0},lastAlert:-99,lastSupMsg:-99,over:null,decals:[]};
  byId=new Map();sel=[];groups={};parts=[];shots=[];pings=[];placing=null;amode=false;rallyMode=false;
  spawn('hq',0,PLAYER_HQ.x,PLAYER_HQ.y);
  field(PLAYER_HQ.x,PLAYER_HQ.y,Math.atan2(680,-1180),8,1500);
  field(ENEMY_HIVE.x,ENEMY_HIVE.y,Math.atan2(-680,1180)+.5,6,1500);
  cluster(1050,650,6,1200,7);cluster(2120,1600,6,1200,11);cluster(1600,1100,5,900,19);
  for(let i=0;i<6;i++){const w=spawn('worker',0,PLAYER_HQ.x+70+(i%3)*22,PLAYER_HQ.y-70+(i/3|0)*22)}
  for(const [t,x,y] of ENEMY_START) spawn(t,1,x,y);
  const nf=[3,5,7][diff], ns=[0,2,3][diff];
  for(let i=0;i<nf+ns;i++){const u=spawn(i<nf?'fang':'spitter',1,2620+(i%4)*26,560+(i/4|0)*26);u.home=true}
  G.ents.filter(e=>e.type==='worker').forEach(w=>gatherNearest(w));
  centerOn(PLAYER_HQ.x+150,PLAYER_HQ.y-120);
  updFog();
}

  for(let i=0;i<320;i++){const k=R();blot(R()*WW,R()*WH,40+R()*240,k<.45?'rgba(42,46,48,.45)':k<.85?'rgba(10,12,14,.45)':'rgba(70,52,40,.20)')}
  // ash dunes

  for(let i=0;i<180;i++){let x=R()*WW,y=R()*WH;g.strokeStyle=`rgba(${R()<.5?'0,0,0':'70,74,76'},${.12+R()*.15})`;g.lineWidth=1+R()*2.5;g.beginPath();g.moveTo(x,y);for(let j=0;j<6;j++){x+=(R()-.5)*90;y+=(R()-.3)*50;g.lineTo(x,y)}g.stroke()}

function nearestNode(x,y,maxD=1e9){let best=null,bd=maxD;for(const e of G.ents){if(e.type!=='crystal'||e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e}}return best}
function gatherNearest(w){const n=nearestNode(w.x,w.y);if(n)w.order={k:'gather',id:n.id,ph:w.carry?'ret':'go',tm:0};}
function formation(units,x,y,k){

  units.slice().sort((a,b)=>a.x-b.x||a.y-b.y).forEach((u,i)=>{
    const cx=(i%cols)-(cols-1)/2, cy=(i/cols|0)-(Math.ceil(n/cols)-1)/2;

}

function reqOk(type){const r=DEF[type].req;return !r||G.ents.some(e=>e.team===0&&e.type===r&&e.built&&!e.dead)}

function nearestHostile(e,range){

  for(const t of G.ents){
    if(t.dead||!hostile(e,t))continue;

    const g=gap(e,t); if(g>range)continue;
    const armed=DEF[t.type].dmg?0:(isB(t)?160:60);
    const sc=g+armed; if(sc<bs){bs=sc;best=t}
  }
  return best;
}
function fire(e,t){

  if(e.type==='tank')e.tface=a; else e.face=a;

  const kind={trooper:'bullet',tank:'shell',turret:'bolt',spitter:'acid',spine:'needle'}[e.type]||'bullet';

  parts.push({k:'flash',x:sx,y:sy,life:.06,max:.06,col:kind==='acid'?ACID:kind==='needle'?HOST:'#ffe9a8',s:kind==='shell'?9:5});

function updShots(dt){
  for(const s of shots){

    const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy),st=s.sp*dt;

      if(s.splash){
        for(const o of G.ents){if(o.dead||o.team<0||o.team===s.team)continue;const g=Math.hypot(o.x-s.tx,o.y-s.ty)-rad(o);if(g<s.splash)hit(o,s.dmg*(g<s.splash*.4?1:.5),byId.get(s.src))}

function hit(t,amt,src){

// ---------- unit logic ----------
function segHit(x0,y0,x1,y1,b,H){
  let t0=0,t1=1;const dx=x1-x0,dy=y1-y0;
  for(const [p,d,c] of [[x0,dx,b.x],[y0,dy,b.y]]){
    const lo=c-H,hi=c+H;
    if(Math.abs(d)<1e-9){if(p<lo||p>hi)return -1;continue}
    let a=(lo-p)/d,bb=(hi-p)/d;if(a>bb){const t=a;a=bb;bb=t}
    t0=Math.max(t0,a);t1=Math.min(t1,bb);if(t0>t1)return -1;
  }
  return t0;
}
function steer(e,x,y){
  let best=null,bt=2;
  for(const b of G.ents){
    if(b.dead||!isB(b))continue;
    const Hin=b.size/2+e.r-1.5;
    if(Math.abs(x-b.x)<=Hin+3&&Math.abs(y-b.y)<=Hin+3)continue;
    const t=segHit(e.x,e.y,x,y,b,Hin);
    if(t>=0&&t<bt){bt=t;best=b}
  }
  if(!best)return null;
  const Hin=best.size/2+e.r-1.5,H=best.size/2+e.r+6;
  let wp=null,wc=1e9;
  for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){
    const cx=best.x+sx*H,cy=best.y+sy*H;
    if(segHit(e.x,e.y,cx,cy,best,Hin)>=0)continue;
    const c=Math.hypot(cx-e.x,cy-e.y)+Math.hypot(x-cx,y-cy);
    if(c<wc){wc=c;wp={x:cx,y:cy}}
  }
  return wp;
}
function moveTo(e,x,y,dt,stop=0){
  let dx=x-e.x,dy=y-e.y,d=Math.hypot(dx,dy);
  if(d<=Math.max(3,stop)){e.mv=0;return true}
  const wp=steer(e,x,y);
  if(wp){dx=wp.x-e.x;dy=wp.y-e.y;d=Math.hypot(dx,dy)||1}
  const st=DEF[e.type].sp*dt,k=Math.min(st,d)/d;
  e.x+=dx*k;e.y+=dy*k;e.face=turn(e.face,Math.atan2(dy,dx),dt*12);e.mv=1;e.goal={x,y};
  return false;
}
function updUnit(e,dt){
  const d=DEF[e.type];
  e.cd=Math.max(0,e.cd-dt); e.mv=0; e.goal=null;
  if(e.team===1&&e.hp<d.hp)e.hp=Math.min(d.hp,e.hp+.6*dt);
  const o=e.order;
  let target=null;
  if(o&&o.k==='attack'){target=byId.get(o.id);if(!alive(target)||!canSee(e.team,target)){e.order=null;target=null}}
  else if(d.dmg&&e.type!=='worker'&&(!o||o.k==='amove'||o.k==='hold')){
    let t=e.tgt&&byId.get(e.tgt);
    const hold=o&&o.k==='hold', lim=hold?d.range:d.sight;
    if(!alive(t)||(e.team===0&&!canSee(0,t))||gap(e,t)>lim*1.2)t=null;
    if(!t||((G.frame+e.id)%15===0&&gap(e,t)>d.range)){const n=nearestHostile(e,lim);if(n)t=n}
    e.tgt=t?t.id:0; target=t;
  }
  if(target){
    const g=gap(e,target);
    if(g<=d.range){e.face=turn(e.face,Math.atan2(target.y-e.y,target.x-e.x),dt*14);if(e.cd<=0){fire(e,target);e.cd=d.cd}}
    else if(!(o&&o.k==='hold'))moveTo(e,target.x,target.y,dt);
    return;
  }
  if(!o)return;
  if(o.k==='move'||o.k==='amove'){
    const dd=Math.hypot(o.x-e.x,o.y-e.y);
    if(moveTo(e,o.x,o.y,dt)){e.order=null;return}
    if(!e.st)e.st={t:0,d:dd}; e.st.t+=dt;
    if(e.st.t>.5){if(e.st.d-dd<5&&dd<70){e.order=null}e.st={t:0,d:dd}}
  }else if(o.k==='gather')updGather(e,o,dt);
  else if(o.k==='build')updBuild(e,o,dt);
}
function updGather(e,o,dt){
  if(o.ph==='go'){
    let n=byId.get(o.id);
    if(!n||n.dead){n=nearestNode(e.x,e.y,600);if(!n){e.order=null;return}o.id=n.id}
    if(gap(e,n)<=4){o.ph='mine';o.tm=1.6}else moveTo(e,n.x,n.y,dt);
  }else if(o.ph==='mine'){
    const n=byId.get(o.id);if(!n||n.dead){o.ph='go';return}
    e.face=Math.atan2(n.y-e.y,n.x-e.x);
    o.tm-=dt; if(Math.random()<dt*6)spark(n.x+(e.x-n.x)*.5,n.y+(e.y-n.y)*.5,CRY,1);
    if(o.tm<=0){const take=Math.min(8,n.amount);n.amount-=take;e.carry=take;if(n.amount<=0){n.dead=true;n.silent=true}o.ph='ret'}
  }else{
    let hq=null,bd=1e9;for(const b of G.ents){if(b.type==='hq'&&b.team===e.team&&b.built&&!b.dead){const dd=distRect(e.x,e.y,b);if(dd<bd){bd=dd;hq=b}}}
    if(!hq){e.order=null;return}
    if(gap(e,hq)<=5){G.money+=e.carry;G.mined+=e.carry;e.carry=0;o.ph='go'}else moveTo(e,hq.x,hq.y,dt);
  }
}
function updBuild(e,o,dt){
  if(!o.bid){
    const s=DEF[o.type].size;
    if(distRect(e.x,e.y,{x:o.x,y:o.y,size:s})<=e.r+8){
      if(!canPlace(o.type,o.x,o.y)){G.money+=o.paid;toast('건설 위치가 막혀 취소했습니다','warn');e.order=null;return}
      const b=spawn(o.type,0,o.x,o.y,false);o.bid=b.id;sfx('build');
      // shove our units out of the footprint
      for(const u of G.ents)if(isU(u)&&!u.dead&&u!==e&&distRect(u.x,u.y,b)<u.r){const a=Math.atan2(u.y-b.y,u.x-b.x);u.x=b.x+Math.cos(a)*(s*.75);u.y=b.y+Math.sin(a)*(s*.75)}
      const a=Math.atan2(e.y-b.y,e.x-b.x);e.x=b.x+Math.cos(a)*(s*.5+e.r+2);e.y=b.y+Math.sin(a)*(s*.5+e.r+2);
    }else moveTo(e,o.x,o.y,dt);
    return;
  }
  const b=byId.get(o.bid);
  if(!b||b.dead||b.built){e.order=null;if(o.resume||e.carry)gatherNearest(e);return}
  if(gap(e,b)>8){moveTo(e,b.x,b.y,dt);return}
  const d=DEF[b.type];
  e.face=Math.atan2(b.y-e.y,b.x-e.x);
  b.prog=Math.min(1,b.prog+dt/d.time);b.hp=Math.min(d.hp,b.hp+d.hp*.9*dt/d.time);
  if(Math.random()<dt*8)spark(e.x+Math.cos(e.face)*12,e.y+Math.sin(e.face)*12,WARN,1);
  if(b.prog>=1){b.built=true;toast(`${d.n} 건설 완료`);sfx('done');e.order=null;if(o.resume)gatherNearest(e)}
}
function updBld(b,dt){
  const d=DEF[b.type];
  if(!b.built)return;
  if(b.queue.length){
    const ut=b.queue[0],ud=DEF[ut];
    b.qprog+=dt/ud.time;
    if(b.qprog>=1){
      b.qprog=0;b.queue.shift();
      const r=b.rally, tx=r?r.x:b.x, ty=r?r.y:b.y+200;
      const a=Math.atan2(ty-b.y,tx-b.x);
      const u=spawn(ut,0,b.x+Math.cos(a)*(b.size/2+ud.r+4),b.y+Math.sin(a)*(b.size/2+ud.r+4));
      u.face=a;G.stats.trained++;
      if(ut==='worker'&&(!r||r.id)){const n=r&&byId.get(r.id);if(n&&!n.dead)u.order={k:'gather',id:n.id,ph:'go',tm:0};else gatherNearest(u)}
      else if(r)u.order={k:'move',x:r.x+(Math.random()-.5)*30,y:r.y+(Math.random()-.5)*30};
      else u.order={k:'move',x:u.x+Math.cos(a)*40,y:u.y+Math.sin(a)*40};
      sfx('ready');
    }
  }
  if(d.dmg){
    b.cd=Math.max(0,(b.cd||0)-dt);
    let t=b.tgt&&byId.get(b.tgt);
    if(!alive(t)||gap(b,t)>d.range||(b.team===0&&!canSee(0,t)))t=nearestHostile(b,d.range);
    b.tgt=t?t.id:0;
    if(t){b.face=turn(b.face,Math.atan2(t.y-b.y,t.x-b.x),dt*8);if(b.cd<=0){fire(b,t);b.cd=d.cd}}
  }
}
function collide(dt){
  const us=G.ents.filter(e=>!e.dead&&isU(e));
  for(let i=0;i<us.length;i++){const a=us[i];
    for(let j=i+1;j<us.length;j++){const b=us[j];
      const ga=a.order&&a.order.k==='gather', gb=b.order&&b.order.k==='gather';
      if(ga&&gb)continue;
      const dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r; if(Math.abs(dx)>min||Math.abs(dy)>min)continue;
      let d=Math.hypot(dx,dy); if(d>=min)continue;
      let nx,ny; if(d<.01){nx=Math.random()-.5;ny=Math.random()-.5;d=Math.hypot(nx,ny);nx/=d;ny/=d;d=0}else{nx=dx/d;ny=dy/d}
      const p=(min-d)*.5, wa=a.mv?0.35:0.65, wb=b.mv?0.35:0.65, s=wa+wb;
      a.x-=nx*p*2*wa/s*.6;a.y-=ny*p*2*wa/s*.6;b.x+=nx*p*2*wb/s*.6;b.y+=ny*p*2*wb/s*.6;
    }}
  const obs=G.ents.filter(e=>!e.dead&&(isB(e)||e.type==='crystal'));
  for(const u of us){
    for(const o of obs){
      if(o.type==='crystal'){
        const dx=u.x-o.x,dy=u.y-o.y,d=Math.hypot(dx,dy),min=u.r+14;
        if(d<min&&d>.01){u.x=o.x+dx/d*min;u.y=o.y+dy/d*min;slide(u,dx/d,dy/d,dt)}
      }else{
        const h=o.size/2; if(Math.abs(u.x-o.x)>h+u.r||Math.abs(u.y-o.y)>h+u.r)continue;
        const cx=clamp(u.x,o.x-h,o.x+h),cy=clamp(u.y,o.y-h,o.y+h);
        let dx=u.x-cx,dy=u.y-cy,d=Math.hypot(dx,dy);
        if(d<.01){const ox=u.x-o.x,oy=u.y-o.y;if(Math.abs(ox)>Math.abs(oy)){u.x=o.x+Math.sign(ox||1)*(h+u.r)}else{u.y=o.y+Math.sign(oy||1)*(h+u.r)}continue}
        if(d<u.r){u.x=cx+dx/d*u.r;u.y=cy+dy/d*u.r;slide(u,dx/d,dy/d,dt)}
      }
    }
    u.x=clamp(u.x,u.r,WW-u.r);u.y=clamp(u.y,u.r,WH-u.r);
  }
}
function slide(u,nx,ny,dt){
  if(!u.goal)return;
  let tx=-ny,ty=nx; const gx=u.goal.x-u.x,gy=u.goal.y-u.y;
  const dot=(tx*gx+ty*gy)/(Math.hypot(gx,gy)||1);
  if(Math.abs(dot)<.15){if(!u.sd)u.sd=u.id%2?1:-1;tx*=u.sd;ty*=u.sd}else if(dot<0){tx=-tx;ty=-ty}
  const s=DEF[u.type].sp*dt*.7; u.x+=tx*s;u.y+=ty*s;
}

// ---------- enemy AI ----------
function ai(dt){
  const A=G.ai, D=DIFF[G.diff];
  const blds=G.ents.filter(e=>e.team===1&&!e.dead&&isB(e));
  const prod=blds.filter(e=>e.type==='hive'||e.type==='pool');
  const hive=prod.find(e=>e.type==='hive');
  A.money+=(3+G.t*.04)*D.m*(hive?1:.45)*(prod.length?1:0)*dt;
  for(const p of prod)p.cd=Math.max(0,(p.cd||0)-dt);
  A.tick-=dt; if(A.tick>0)return; A.tick=.5;
  const base=hive||blds[0]; if(!base)return;
  const ang=Math.atan2(1100-base.y,1600-base.x);
  const stage={x:base.x+Math.cos(ang)*230,y:base.y+Math.sin(ang)*230};
  // production
  const t=G.t,r=Math.random();
  const want=t<110?'fang':t<330?(r<.55?'fang':'spitter'):(r<.4?'fang':r<.78?'spitter':'brute');
  const ud=DEF[want], s=supplyOf(1);
  if(A.money>=ud.cost&&s.used+ud.sup<=s.cap){
    const p=prod.filter(p=>p.cd<=0).sort((a,b)=>Math.hypot(a.x-stage.x,a.y-stage.y)-Math.hypot(b.x-stage.x,b.y-stage.y))[0];
    if(p){const a=Math.atan2(stage.y-p.y,stage.x-p.x)+(Math.random()-.5);
      const u=spawn(want,1,p.x+Math.cos(a)*(p.size/2+ud.r+3),p.y+Math.sin(a)*(p.size/2+ud.r+3));
      u.home=true;u.order={k:'move',x:stage.x+(Math.random()-.5)*160,y:stage.y+(Math.random()-.5)*160};
      A.money-=ud.cost;p.cd={fang:5,spitter:8,brute:14}[want]/D.m;}
  }
  const units=G.ents.filter(e=>e.team===1&&!e.dead&&isU(e));
  // scout
  if(!A.scouted&&t>55){A.scouted=true;const f=spawn('fang',1,stage.x,stage.y);f.order={k:'amove',x:PLAYER_HQ.x+120,y:PLAYER_HQ.y-160}}
  // defense
  let threat=null;
  for(const e of G.ents){if(e.dead||e.team!==0)continue;for(const b of blds){if(Math.hypot(e.x-b.x,e.y-b.y)<620){threat=e;break}}if(threat)break}
  if(!threat&&A.threat&&G.t-A.threat.t<3&&blds.some(b=>Math.hypot(A.threat.x-b.x,A.threat.y-b.y)<800))threat=A.threat;
  for(const u of units){
    if(u.home){
      if(threat){if(!u.order||u.order.k!=='attack'){if(!u.order||u.order.k==='move'||!u.tgt){u.order={k:'amove',x:threat.x,y:threat.y}}}}
      else if(!u.order&&!u.tgt&&Math.hypot(u.x-stage.x,u.y-stage.y)>260)u.order={k:'move',x:stage.x+(Math.random()-.5)*160,y:stage.y+(Math.random()-.5)*160};
    }else if(!u.order&&!u.tgt){const tg=playerTarget(u);if(tg)u.order={k:'amove',x:tg.x,y:tg.y}}
  }
  // waves
  if(t>=A.next){
    const army=units.filter(u=>u.home).sort((a,b)=>DEF[b.type].hp-DEF[a.type].hp).slice(0,5+A.wave*3);
    const need=Math.min(14,2+A.wave);
    if(army.length>=need){
      const tg=playerTarget(base);
      if(tg){for(const u of army){u.home=false;u.order={k:'amove',x:tg.x+(Math.random()-.5)*80,y:tg.y+(Math.random()-.5)*80};u.tgt=0}
        A.wave++;toast(`군체 ${A.wave}차 습격이 시작됐습니다 · ${army.length}개체`,'bad');sfx('alert');}
      A.next=t+Math.max(50,D.gap-A.wave*4);
    }else A.next=t+12;
  }
}
function playerTarget(from){
  let best=null,bd=1e9;
  for(const e of G.ents){if(e.dead||e.team!==0)continue;const d=Math.hypot(e.x-from.x,e.y-from.y)+(isB(e)?0:300);if(d<bd){bd=d;best=e}}
  return best;
}

const fogC=document.createElement('canvas');fogC.width=GW;fogC.height=GH;const fctx=fogC.getContext('2d');const fogImg=fctx.createImageData(GW,GH);

// ---------- audio ----------
let AC=null,muted=false,noiseBuf=null;const lastS={};
function initAudio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();
  noiseBuf=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)}catch(err){AC=null}
  if(!AC)return;
  for(const [name,b64] of Object.entries(SFX_SRC)){
    try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      const p=AC.decodeAudioData(u.buffer,buf=>{SBUF[name]=buf},()=>{});if(p&&p.catch)p.catch(()=>{})}catch(err){}
  }
}
const SBUF={};
// sound key -> [sample, playback rate, volume]
const SMAP={bullet:['bullet',1,.3],bolt:['bolt',1,.3],shell:['bullet',.55,.45],acid:['hurt',1.3,.4],needle:['bolt',1.5,.22],
  melee:['melee',1,.35],boom:['boom',1,.55],bigboom:['boom',.6,.85],die:['die',1,.3],ack:['ack',1,.5],click:['click',1,.5],
  err:['err',1,.35],build:['build',1,.6],done:['done',1,.6],ready:['ready',1,.35]};
function sample(k,n){
  const m=SMAP[k];if(!m)return false;const buf=SBUF[m[0]];if(!buf)return false;
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=buf;s.playbackRate.value=m[1]*(0.94+Math.random()*.12);
  g.gain.value=m[2];s.connect(g);g.connect(AC.destination);s.start(n);return true;
}
function onScreen(e,pad=40){return e.x>cam.x-pad&&e.x<cam.x+VW/z+pad&&e.y>cam.y-pad&&e.y<cam.y+VH/z+pad}
function sfx(k,e){
  if(!AC||muted||!started)return; if(e&&!onScreen(e))return;
  const n=AC.currentTime; if(lastS[k]&&n-lastS[k]<.06)return; lastS[k]=n;
  if(sample(k,n))return;
  const g=AC.createGain();g.connect(AC.destination);
  const tone=(type,f1,f2,dur,vol)=>{const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+dur);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);o.connect(g);o.start(n);o.stop(n+dur+.02)};
  const noise=(dur,vol,f)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;s.connect(fl);fl.connect(g);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+dur);s.start(n);s.stop(n+dur)};
  switch(k){
    case 'bullet':tone('square',1400,500,.04,.025);break;
    case 'bolt':tone('sawtooth',900,300,.08,.03);break;
    case 'shell':noise(.18,.09,900);break;
    case 'acid':tone('sine',260,620,.12,.04);break;
    case 'needle':tone('triangle',1800,900,.05,.03);break;
    case 'melee':noise(.05,.04,2500);break;
    case 'boom':noise(.3,.12,600);break;
    case 'bigboom':noise(.6,.2,380);break;
    case 'die':noise(.12,.05,1400);break;
    case 'ack':tone('triangle',660,880,.07,.05);break;
    case 'click':tone('sine',900,700,.05,.04);break;
    case 'err':tone('square',220,160,.12,.04);break;
    case 'build':tone('triangle',330,660,.15,.05);break;
    case 'done':tone('triangle',520,1040,.25,.06);break;
    case 'ready':tone('sine',740,990,.1,.04);break;
    case 'alert':tone('sawtooth',440,330,.35,.05);break;
  }
}

// ---------- camera / picking ----------
function centerOn(x,y){cam.x=x-VW/z/2;cam.y=y-VH/z/2;clampCam()}
function clampCam(){
  const vw=VW/z,vh=VH/z;
  cam.x=vw>=WW?(WW-vw)/2:clamp(cam.x,0,WW-vw);
  cam.y=vh>=WH?(WH-vh)/2:clamp(cam.y,0,WH-vh);
}
function toWorld(sx,sy){return{x:sx/z+cam.x,y:sy/z+cam.y}}
function pick(wx,wy){
  if(!G)return null;
  for(let i=G.ents.length-1;i>=0;i--){const e=G.ents[i];if(e.dead||!isU(e))continue;if(e.team===1&&!visAt(e.x,e.y))continue;if(Math.hypot(e.x-wx,e.y-wy)<=e.r+6)return e}
  for(const e of G.ents){if(e.dead||!isB(e))continue;if(e.team===1&&!G.explored[cellI(e.x,e.y)])continue;const h=e.size/2;if(Math.abs(e.x-wx)<=h&&Math.abs(e.y-wy)<=h)return e}
  for(const e of G.ents){if(e.type!=='crystal'||e.dead)continue;if(!G.explored[cellI(e.x,e.y)])continue;if(Math.hypot(e.x-wx,e.y-wy)<=22)return e}
  return null;
}
let lastTap={t:0,id:0};
function selectAt(wx,wy,shift){
  const t=pick(wx,wy); const now=performance.now();
  const dbl=t&&lastTap.id===t.id&&now-lastTap.t<350; lastTap={t:now,id:t?t.id:0};
  if(!t){if(!shift)sel=[];return}
  if(dbl&&t.team===0){sel=G.ents.filter(e=>!e.dead&&e.team===0&&e.type===t.type&&onScreen(e,0)).map(e=>e.id);return}
  const os=ownSel();
  if(shift&&t.team===0&&os.length&&isU(t)===isU(os[0])){const i=sel.indexOf(t.id);if(i>=0)sel.splice(i,1);else sel.push(t.id);return}
  sel=[t.id];if(t.team===0)sfx('click');
}
function boxSelect(x0,y0,x1,y1,shift){
  const ax=Math.min(x0,x1),bx=Math.max(x0,x1),ay=Math.min(y0,y1),by=Math.max(y0,y1);
  const inR=e=>e.x+rad(e)>=ax&&e.x-rad(e)<=bx&&e.y+rad(e)>=ay&&e.y-rad(e)<=by;
  let u=G.ents.filter(e=>!e.dead&&e.team===0&&isU(e)&&inR(e));
  if(!u.length)u=G.ents.filter(e=>!e.dead&&e.team===0&&isB(e)&&inR(e));
  if(!u.length){if(!shift)sel=[];return}
  const ids=u.slice(0,36).map(e=>e.id);
  sel=shift&&ownSel().length?[...new Set([...sel,...ids])]:ids; sfx('click');
}

  const r=cv.getBoundingClientRect(),sx=ev.clientX-r.left,sy=ev.clientY-r.top,w=toWorld(sx,sy);
  pointers.set(ev.pointerId,{x:sx,y:sy});
  if(pointers.size===2){const [a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,w:toWorld((a.x+b.x)/2,(a.y+b.y)/2)};drag=null;return}
  if(ev.button===2){

  mouse.sx=sx;mouse.sy=sy;mouse.in=true;mouse.type=ev.pointerType;

  if(pinch&&pointers.size===2){
    const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    z=clamp(pinch.z*d/pinch.d,.45,1.5);const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;

  }

  if(drag.mode==='pan'&&drag.moved){cam.x-=(sx-drag.x)/z;cam.y-=(sy-drag.y)/z;clampCam()}

function endPointer(ev){

let currentSlots=[],cardSig='';
function slotsFor(){
  const s=ownSel();
  if(!started||!G||!s.length)return [];
  if(placing||amode||rallyMode)return [null,null,null,null,null,null,null,null,{l:'취소',key:'Escape',kl:'ESC',fn:()=>{placing=null;amode=false;rallyMode=false}}];
  const us=s.filter(isU);
  if(us.length){
    const out=[{l:'공격',key:'A',fn:()=>{amode=true}},{l:'정지',key:'S',fn:stopSel},{l:'위치 고수',key:'H',fn:holdSel}];
    if(us.some(u=>u.type==='worker')){
      out.push({l:'수집',key:'G',fn:gatherSel});
      for(const b of ['depot','barracks','factory','turret','hq']){const d=DEF[b];out.push({l:d.n,key:d.key,cost:d.cost,dis:!reqOk(b),fn:()=>beginPlace(b),hint:d.req&&!reqOk(b)?`${DEF[d.req].n} 필요`:''})}
    }
    return out;
  }
  const b=s[0];
  if(!b.built)return [null,null,null,null,null,null,null,null,{l:'건설 취소',key:'X',fn:cancelBuild}];
  const out=[];
  for(const u of DEF[b.type].makes||[]){const d=DEF[u];out.push({l:d.n,key:d.key,cost:d.cost,sup:d.sup,fn:()=>train(u)})}
  if(DEF[b.type].makes)out.push({l:'집결 지점',key:'R',fn:()=>{rallyMode=true}});
  return out;
}

function resize(){

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU)}

// draw an atlas sprite anchored at its bottom-centre
function spr(name,x,y,w,flip,alpha){
  const r=RECTS[name];if(!atlasOK||!r)return false;
  const h=w*r[3]/r[2];ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);if(alpha!=null)ctx.globalAlpha=alpha;
  ctx.drawImage(ATLAS,r[0],r[1],r[2],r[3],-w/2,-h,w,h);ctx.restore();return true;
}
function sprH(name,w){const r=RECTS[name];return w*r[3]/r[2]}
function drawCrystal(e,T){
  const k=.55+.45*e.amount/e.max;
  if(atlasOK){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(e.x+3,e.y+8,16*k,8*k,0,0,TAU);ctx.fill();
    ctx.save();ctx.shadowColor=CRY;ctx.shadowBlur=6+3*Math.sin(T*2+e.id);spr('crystal',e.x,e.y+12,44*k);ctx.restore();return}
  ctx.save();ctx.translate(e.x,e.y);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(3,6,16*k,9*k,0,0,TAU);ctx.fill();
  const shard=(ox,oy,h,w,rot)=>{ctx.save();ctx.translate(ox,oy);ctx.rotate(rot);ctx.beginPath();ctx.moveTo(0,-h);ctx.lineTo(w,0);ctx.lineTo(0,h*.35);ctx.lineTo(-w,0);ctx.closePath();
    const g=ctx.createLinearGradient(-w,-h,w,h*.3);g.addColorStop(0,'#d8f4ff');g.addColorStop(.5,CRY);g.addColorStop(1,'#2f6f96');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='rgba(220,245,255,.6)';ctx.lineWidth=1;ctx.stroke();ctx.restore()};
  ctx.shadowColor=CRY;ctx.shadowBlur=10+3*Math.sin(T*2+e.id);
  shard(-7*k,2,16*k,5*k,-.35);shard(6*k,3,13*k,5*k,.4);shard(0,0,22*k,6*k,.05);
  ctx.shadowBlur=0;ctx.restore();
}
function drawBld(e,T){

    const w=s*(e.type==='spine'?.95:e.type==='turret'?1.35:1.25), by=e.y+h*1.02;

      const sh=sprH(e.type,w);ctx.save();ctx.beginPath();ctx.rect(e.x-w,by-sh*e.prog,w*2,sh*e.prog);ctx.clip();spr(e.type,e.x,by,w);ctx.restore();
      ctx.setLineDash([6,5]);ctx.strokeStyle=ALLY;ctx.lineWidth=1.5;rr(ctx,e.x-h,e.y-h,s,s,5);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=ALLY;ctx.font='600 12px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.floor(e.prog*100)+'%',e.x,e.y);

    if(e.team===0&&e.queue&&e.queue.length){ctx.fillStyle=`rgba(63,214,198,${.4+.4*Math.sin(T*6)})`;ctx.beginPath();ctx.arc(e.x+h*.7,e.y-h*.7,3.5,0,TAU);ctx.fill()}
    return;
  }
  ctx.save();ctx.translate(e.x,e.y);
  ctx.fillStyle='rgba(0,0,0,.4)';
  if(e.team===1){ctx.beginPath();ctx.ellipse(6,8,h*1.02,h*.9,0,0,TAU);ctx.fill()}else{rr(ctx,-h+6,-h+8,s,s,6);ctx.fill()}
  if(e.team===0){
    if(!e.built){
      ctx.fillStyle='rgba(34,43,50,.85)';rr(ctx,-h,-h,s,s,5);ctx.fill();
      ctx.fillStyle='rgba(63,214,198,.18)';ctx.fillRect(-h,h-s*e.prog,s,s*e.prog);
      ctx.strokeStyle='rgba(63,214,198,.25)';ctx.lineWidth=1.5;ctx.beginPath();

      ctx.setLineDash([6,5]);ctx.strokeStyle=ALLY;ctx.lineWidth=1.5;rr(ctx,-h,-h,s,s,5);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=ALLY;ctx.font='600 12px "IBM Plex Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.floor(e.prog*100)+'%',0,0);
      ctx.restore();return;
    }
    const plate=()=>{const g=ctx.createLinearGradient(-h,-h,h,h);g.addColorStop(0,STEEL3);g.addColorStop(.35,STEEL2);g.addColorStop(1,STEEL);ctx.fillStyle=g;rr(ctx,-h,-h,s,s,6);ctx.fill();ctx.strokeStyle='rgba(63,214,198,.55)';ctx.lineWidth=1.5;ctx.stroke();ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1;rr(ctx,-h+6,-h+6,s-12,s-12,4);ctx.stroke()};
    const working=e.queue&&e.queue.length;
    switch(e.type){
      case 'hq':{plate();
        ctx.fillStyle=STEEL;ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*TAU+Math.PI/8;ctx.lineTo(Math.cos(a)*h*.62,Math.sin(a)*h*.62)}ctx.closePath();ctx.fill();ctx.strokeStyle=STEEL3;ctx.stroke();
        const g=ctx.createRadialGradient(0,0,2,0,0,h*.4);g.addColorStop(0,'#c9fff8');g.addColorStop(.4,ALLY);g.addColorStop(1,'rgba(63,214,198,0)');ctx.fillStyle=g;circ(0,0,h*(.36+.03*Math.sin(T*2)));ctx.fill();
        ctx.fillStyle=ALLY;for(const [x,y] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ctx.fillRect(x*(h-12)-4,y*(h-12)-4,8,8)}
        break}
      case 'depot':{plate();for(let i=0;i<3;i++){ctx.fillStyle=`rgba(63,214,198,${.35+.35*Math.max(0,Math.sin(T*3-i))})`;ctx.fillRect(-h+12+i*((s-24)/3),-h+12,(s-24)/3-4,s-24)}break}
