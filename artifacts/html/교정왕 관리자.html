<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>교정왕 관리자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* 레이아웃: 교정왕 본 서비스와 같은 토큰. 상단 바 + 왼쪽 메뉴 + 본문, 상세는 오른쪽 서랍. 흰 테마 기본, 다크 지원 */
:root{
  --bg:#f3f4f6; --pane:#ffffff; --pane2:#f7f8fa; --soft:#f1f3f5; --hover:#eceef1; --hover2:#e2e5e9;
  --ink:#16181c; --text:#22252b; --muted:#5f6670; --dim:#9aa0a8; --line:#e3e6ea; --line2:#cfd4da;
  --accent:#1ed760; --accent-hover:#3be477; --on-accent:#000000; --btn:#0f9d4a; --btn-hover:#0c8a40; --on-btn:#ffffff; --accent-soft:rgba(30,215,96,.15); --accent-ink:#0b7a35;
  --good:#0b7a35; --good-bg:rgba(30,215,96,.15); --warn:#9a6200; --warn-bg:rgba(255,176,0,.18); --bad:#c21f2f; --bad-bg:rgba(209,26,42,.09); --info:#1d5fd1; --info-bg:rgba(29,95,209,.1);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --st-bad:#d92d3a; --st-warn:#b8661c; --st-good:#1ed760; --st-info:#2a6fd6; --pill:500px;
  --card-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06); --shadow:0 12px 36px rgba(16,24,40,.18);
  --f-ui:"Figtree","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --pane:#181818; --pane2:#1e1e1e; --soft:#242424; --hover:#2a2a2a; --hover2:#353535;
  --ink:#ffffff; --text:#e8e8e8; --muted:#b3b3b3; --dim:#7a7a7a; --line:#2c2c2c; --line2:#444444;
  --accent:#1ed760; --accent-hover:#3be477; --on-accent:#000000; --btn:#13a854; --btn-hover:#18b85d; --on-btn:#ffffff; --accent-soft:rgba(30,215,96,.14); --accent-ink:#1ed760;
  --good:#3ddc84; --good-bg:rgba(30,215,96,.16); --warn:#f0b35e; --warn-bg:rgba(255,176,0,.16); --bad:#ff8178; --bad-bg:rgba(243,114,127,.15); --info:#8bb8ff; --info-bg:rgba(106,168,255,.15);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --st-bad:#e5484d; --st-warn:#c47524; --st-good:#1ed760; --st-info:#3b82f6;
  --card-shadow:0 1px 2px rgba(0,0,0,.4); --shadow:0 12px 36px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --pane:#181818; --pane2:#1e1e1e; --soft:#242424; --hover:#2a2a2a; --hover2:#353535;
  --ink:#ffffff; --text:#e8e8e8; --muted:#b3b3b3; --dim:#7a7a7a; --line:#2c2c2c; --line2:#444444;
  --accent:#1ed760; --accent-hover:#3be477; --on-accent:#000000; --btn:#13a854; --btn-hover:#18b85d; --on-btn:#ffffff; --accent-soft:rgba(30,215,96,.14); --accent-ink:#1ed760;
  --good:#3ddc84; --good-bg:rgba(30,215,96,.16); --warn:#f0b35e; --warn-bg:rgba(255,176,0,.16); --bad:#ff8178; --bad-bg:rgba(243,114,127,.15); --info:#8bb8ff; --info-bg:rgba(106,168,255,.15);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --st-bad:#e5484d; --st-warn:#c47524; --st-good:#1ed760; --st-info:#3b82f6;
  --card-shadow:0 1px 2px rgba(0,0,0,.4); --shadow:0 12px 36px rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.lucide{width:17px;height:17px;stroke-width:1.9;flex:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--pane)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:56px;background:var(--pane);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.03em;white-space:nowrap}
.logo .mark{width:28px;height:28px;border-radius:8px;background:var(--btn);color:var(--on-btn);display:grid;place-items:center}
.logo .mark svg.lucide{width:16px;height:16px;stroke-width:2.6}
.adm{font-size:11px;font-weight:800;color:var(--on-btn);background:var(--ink);border-radius:6px;padding:2px 7px;letter-spacing:.02em}
.gsearch{margin-left:24px;display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:var(--r);padding:0 10px;width:min(320px,30vw)}
.gsearch input{border:0;background:transparent;padding:8px 0;flex:1;min-width:0;font-size:13px}
.gsearch input:focus{outline:none}
.gsearch svg.lucide{width:15px;height:15px;color:var(--dim)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.demo{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:3px 8px;white-space:nowrap}
.icb{width:36px;height:36px;border:0;border-radius:var(--r);background:none;color:var(--muted);display:grid;place-items:center;position:relative}
.icb:hover{background:var(--hover);color:var(--ink)}
.dotb{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--pane)}
.me{width:32px;height:32px;border-radius:50%;background:var(--btn);color:var(--on-btn);font-weight:800;font-size:13px;display:grid;place-items:center}
@media (max-width:760px){.gsearch,.demo{display:none}}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px)}
.nav{background:var(--pane);border-right:1px solid var(--line);padding:14px 10px 24px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.ng{font-size:11px;font-weight:700;color:var(--dim);padding:14px 10px 6px;letter-spacing:.02em}
.ng:first-child{padding-top:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--text);text-decoration:none;font-weight:600;font-size:13px}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.nav a .cnt{margin-left:auto;min-width:20px;height:18px;border-radius:9px;background:var(--bad);color:#ffffff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.nav a .cnt.z{display:none}
.navfoot{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:6px}
.navfoot a{padding:6px 0;color:var(--accent-ink);font-weight:700}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:12;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .ng,.navfoot{display:none}
  .nav a{white-space:nowrap;flex:none}
}
.main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:901px){.main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}

/* page head */
.ph{display:flex;align-items:flex-end;gap:12px 16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ph .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:2px;background:var(--soft);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--pane);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{border:1px solid var(--line2);background:var(--pane);border-radius:var(--r);padding:7px 13px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.pri:hover{background:var(--btn-hover)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--hover)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn svg.lucide{width:15px;height:15px}

/* panels */
.panel{background:var(--pane);border:1px solid var(--line);border-radius:12px;box-shadow:var(--card-shadow);min-width:0}
.panel > header{display:flex;align-items:center;gap:8px;padding:14px 18px 0;flex-wrap:wrap}
.panel > header h2{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.panel > header .sub{font-size:12px;color:var(--muted)}
.panel > header .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.pb{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2e{grid-template-columns:minmax(0,1fr)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1240px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--pane);border:1px solid var(--line);border-radius:12px;box-shadow:var(--card-shadow);padding:14px 16px 12px;display:grid;gap:4px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .l svg.lucide{width:14px;height:14px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .d{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.kpi .d.up{color:var(--good)}.kpi .d.down{color:var(--bad)}.kpi .d.flat{color:var(--muted)}
.kpi .d span{color:var(--dim);font-weight:500}
.kpi.alert{border-color:var(--bad);background:var(--bad-bg)}
.kpi.alert .v{color:var(--bad)}
.spark{height:28px;width:100%;display:block;margin-top:4px}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:5;transform:translate(-50%,calc(-100% - 10px));box-shadow:var(--shadow)}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* horizontal bars */
.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;position:relative}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;display:flex;align-items:center;gap:6px}
.hb .n svg.lucide{width:14px;height:14px;color:var(--muted)}
.hb .t{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.hb .f{height:100%;background:var(--accent);border-radius:5px}
.hb .f.alt{background:var(--s1)}
.hb .f.badf{background:var(--bad)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.hb .v small{display:block;font-weight:500;color:var(--dim);font-size:11px}
.hb:hover .t{outline:2px solid var(--line2);outline-offset:2px}

/* stacked 100% bar */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--pane)}
.stack span{height:100%}
.stackl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.stackl div{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stackl i{width:10px;height:10px;border-radius:3px;flex:none}
.stackl b{color:var(--ink);font-variant-numeric:tabular-nums;margin-left:auto}

/* funnel */
.funnel{display:grid;gap:8px}
.fs{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px}
.fs .n{font-weight:600;white-space:nowrap}
.fs .t{height:26px;background:var(--soft);border-radius:6px;position:relative;overflow:hidden}
.fs .f{height:100%;background:var(--accent-soft);border-right:3px solid var(--accent);border-radius:6px 0 0 6px}
.fs .f.full{border-radius:6px}
.fs .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.fs .v small{color:var(--dim);font-weight:500;margin-left:4px}
.fs .drop{grid-column:2/4;font-size:11px;color:var(--bad);margin-top:-4px;font-weight:600}
@media (max-width:560px){.fs{grid-template-columns:minmax(0,1fr) 90px}.fs .t{grid-column:1/-1;grid-row:2}.fs .drop{grid-column:1/-1}.hb{grid-template-columns:minmax(80px,110px) minmax(0,1fr) 60px}}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--pane2)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--accent-soft)}
td .sub{display:block;font-size:12px;color:var(--muted)}
td.wrapc{white-space:normal;min-width:240px;max-width:440px}
.clamp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.unread td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.unread td .ttl{font-weight:800}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.pill svg.lucide{width:12px;height:12px}
.p-good{color:var(--good);background:var(--good-bg)}
.p-warn{color:var(--warn);background:var(--warn-bg)}
.p-bad{color:var(--bad);background:var(--bad-bg)}
.p-info{color:var(--info);background:var(--info-bg)}
.p-mute{color:var(--muted);background:var(--soft)}
.via{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.via i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:900}
.v-kakao i{background:#FEE500;color:#191919}
.v-naver i{background:#03C75A;color:#ffffff}
.v-google i{background:var(--soft);color:var(--s1);border:1px solid var(--line2)}
.v-email i{background:var(--soft);color:var(--muted);border:1px solid var(--line2)}
.mono{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

/* filters bar */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.fbar .search{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:var(--r);padding:0 10px;flex:1 1 200px;max-width:320px}
.fbar .search input{border:0;background:transparent;padding:7px 0;flex:1;min-width:0;font-size:13px}
.fbar .search input:focus{outline:none}
.fbar .search svg.lucide{width:15px;height:15px;color:var(--dim)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:var(--pane);border-radius:var(--r);padding:5px 11px;font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;gap:5px;white-space:nowrap}
.chips button b{color:var(--ink);font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.chips button[aria-pressed="true"] b{color:var(--accent-ink)}
.fbar select{border:1px solid var(--line2);border-radius:var(--r);background:var(--pane);padding:6px 8px;font-size:12px;font-weight:600}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* todo list */
.todo{display:grid;gap:2px}
.todo a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:var(--text);text-decoration:none}
.todo a:hover{background:var(--hover)}
.todo .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.todo .tx{min-width:0;flex:1}
.todo .tx b{display:block;font-size:13px}
.todo .tx span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .n{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--pane);z-index:31;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:16px;font-weight:800;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{flex:1;overflow:auto;padding:18px;display:grid;gap:18px;align-content:start}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}

/* ---------- 서랍 ---------- */
let TPL = [];
function drawer(title, body, foot, tpl) {
  TPL = tpl || [];
  return `<div class="scrim" data-do="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dh"><h3>${esc(title)}</h3><button class="icb" data-do="close" aria-label="닫기">${I('x')}</button></div><div class="db">${body}</div><div class="df">${foot}</div></aside>`;
}
function renderDrawer() {
  const h = S.mi ? dMember(S.mi) : S.ri ? dReport(S.ri) : S.qi ? dInq(S.qi) : '';
  $('drawerHost').innerHTML = h; icons();
}
function closeDrawer() { S.mi = S.ri = S.qi = null; S.del = null; renderDrawer(); render(); }

/* ---------- 렌더 ---------- */
const VIEWS = { overview: vOverview, traffic: vTraffic, usage: vUsage, members: vMembers, reports: vReports, inquiries: vInquiries, rules: vRules, notices: vNotices, admins: vAdmins };
function render() {
  renderNav();
  $('view').innerHTML = VIEWS[S.view]();
  if (S.view === 'overview') bindLine('lcV', series(S.range), 'var(--accent)', '명');
  if (S.view === 'usage') bindLine('lcR', series(S.range), 'var(--s1)', '회');
  if (S.view === 'members') {
    $('mq').addEventListener('input', e => { S.mq = e.target.value; const p = e.target.selectionStart; render(); const i = $('mq'); i.focus(); i.setSelectionRange(p, p); });
    $('mvia').addEventListener('change', e => { S.mvia = e.target.value; render(); });
  }
  if (S.view === 'reports') $('rtype').addEventListener('change', e => { S.rtype = e.target.value; render(); });
  if (S.view === 'notices') {
    const up = () => { $('pvT').textContent = $('ntitle').value || '제목'; $('pvB').textContent = $('nbody').value || '내용'; };
    $('ntitle').addEventListener('input', up); $('nbody').addEventListener('input', up);
    $('nform').addEventListener('submit', e => {
      e.preventDefault();
      NOTICES.unshift({ id: 'n' + Date.now(), at: 0, kind: $('nkind').value, target: $('ntarget').value, title: $('ntitle').value.trim(), body: $('nbody').value.trim(), reach: 0 });
      saveAll(); render(); toast('공지를 보냈어요 (예시 · 실제 발송은 개발 단계에서 연결)');
    });
  }
  icons();
}
function go() {
  const h = location.hash.replace('#', '');
  S.view = VIEWS[h] ? h : 'overview'; S.mi = S.ri = S.qi = null; $('drawerHost').innerHTML = '';
  render(); window.scrollTo(0, 0);
}
addEventListener('hashchange', go);

/* ---------- 이벤트 ---------- */
document.addEventListener('click', e => {
  if (!$('amenu').hidden && !e.target.closest('#acct')) { $('amenu').hidden = true; document.querySelector('.who').setAttribute('aria-expanded', 'false'); }
  if (e.target.closest('#amenu a')) $('amenu').hidden = true;
  const t = e.target.closest('[data-range],[data-member],[data-report],[data-inq],[data-mf],[data-rf],[data-qf],[data-rtab],[data-rule],[data-do],[data-tpl],[data-arm],[data-ban],[data-unban],[data-savememo],[data-rsave],[data-qsave],[data-except],[data-faq]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.range) { S.range = +ds.range; store('ka-range', S.range); render(); return; }
  if (ds.member) { S.mi = ds.member; S.del = null; renderDrawer(); if (S.view === 'members') render(); return; }
  if (ds.report) { S.ri = ds.report; renderDrawer(); render(); return; }
  if (ds.inq) { S.qi = ds.inq; renderDrawer(); render(); return; }
  if (ds.mf) { S.mf = ds.mf; render(); return; }
  if (ds.rf) { S.rf = ds.rf; render(); return; }
  if (ds.qf) { S.qf = ds.qf; render(); return; }
  if (ds.rtab) { S.ruleTab = ds.rtab; render(); return; }
  if (ds.rule) { const r = RULES.find(x => x.id === ds.rule); r.on = !r.on; saveAll(); render(); toast(`「${r.n}」 규칙을 ${r.on ? '켰어요' : '껐어요'}`); return; }
  if (ds.tpl != null) { const ta = $(ds.for); ta.value = ds.append ? ta.value + TPL[+ds.tpl] : TPL[+ds.tpl]; ta.focus(); return; }
  if (ds.arm) { S.del = ds.arm; renderDrawer(); return; }
  if (ds.ban) { const m = MEMBERS.find(x => x.id === ds.ban); m.st = 'banned'; S.del = null; renderDrawer(); render(); toast(`${m.name} 회원의 이용을 정지했어요`); return; }
  if (ds.unban) { const m = MEMBERS.find(x => x.id === ds.unban); m.st = 'active'; renderDrawer(); render(); toast('이용 정지를 풀었어요'); return; }
  if (ds.savememo) { const m = MEMBERS.find(x => x.id === ds.savememo); m.memo = $('mmemo').value; toast('메모를 저장했어요'); return; }
  if (ds.rsave) {
    const r = REPORTS.find(x => x.id === ds.rsave); r.st = $('rst').value; const rep = $('rreply').value.trim(); if (rep) r.reply = rep;
    if (rep && r.st === 'new') r.st = 'doing';
    saveAll(); toast(rep ? '저장하고 신고자에게 답변을 보냈어요 (예시)' : '처리 상태를 저장했어요'); closeDrawer(); return;
  }
  if (ds.except) {
    const r = REPORTS.find(x => x.id === ds.except); const ex = load('ka-except', ['유저 (게임 문서)', '매우 (논문 초록)']);
    const w = r.sug[0].trim(); if (!ex.some(x => x.startsWith(w))) { ex.push(w + ' (신고 ' + r.id + ')'); store('ka-except', ex); }
    $('rst').value = 'done'; $('rreply').value = '말씀하신 표현을 규칙 예외로 등록했습니다. 이제 해당 제안이 나오지 않아요.';
    toast(`「${w}」를 규칙 예외로 등록했어요. 답변을 확인하고 보내 주세요`); return;
  }
  if (ds.qsave) {
    const q = INQ.find(x => x.id === ds.qsave), rep = $('qreply').value.trim();
    if (!rep) { toast('답변을 먼저 써 주세요'); $('qreply').focus(); return; }
    q.reply = rep; q.st = 'done'; saveAll(); toast(`${q.email}로 답변을 보냈어요 (예시)`); closeDrawer(); return;
  }
  if (ds.faq) { toast('FAQ 후보에 담았어요'); return; }
  const a = ds.do;
  if (a === 'close') { closeDrawer(); return; }
  if (a === 'delCancel') { S.del = null; renderDrawer(); return; }
  if (a === 'theme') { P = dark() ? 'light' : 'dark'; store('ka-theme', P); applyTheme(); render(); return; }
  if (a === 'acct') { const m = $('amenu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', !m.hidden); icons(); return; }
  if (a === 'myinfo' || a === 'pw') { $('amenu').hidden = true; toast(a === 'pw' ? '비밀번호 변경은 개발 단계에서 연결돼요' : '내 정보 수정은 개발 단계에서 연결돼요'); return; }
  if (a === 'logout') { $('amenu').hidden = true; toast('로그아웃은 개발 단계에서 연결돼요'); return; }
  if (a === 'csv') { toast('명단 내려받기는 개발 단계에서 연결돼요'); return; }
  if (a === 'ruleAdd') { toast('규칙 추가 화면은 다음 단계에서 만들게요'); return; }
  if (a === 'adminAdd') { toast('초대 메일 발송은 개발 단계에서 연결돼요'); return; }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && $('drawerHost').innerHTML) closeDrawer(); });
$('gq').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim(); if (!q) return;
  if (/^R-/i.test(q)) { const r = REPORTS.find(x => x.id.toLowerCase() === q.toLowerCase()); if (r) { location.hash = 'reports'; setTimeout(() => { S.ri = r.id; renderDrawer(); render(); }, 0); return; } }
  if (/^Q-/i.test(q)) { const r = INQ.find(x => x.id.toLowerCase() === q.toLowerCase()); if (r) { location.hash = 'inquiries'; setTimeout(() => { S.qi = r.id; renderDrawer(); render(); }, 0); return; } }
  S.mq = q; S.mf = 'all'; if (location.hash === '#members') render(); else location.hash = 'members';
});

/* ---------- 테마 ---------- */
