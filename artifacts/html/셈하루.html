<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>셈하루</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 당근색 앱바 + 둥근 카드 쌓기(조안호 연산 구조 + 학습현황 카드 디자인), 흰 바탕·민트그린·검정. 의도적 라이트 단일 테마 */
:root{
  color-scheme:light;
  --bg:#F3F7F5; --paper:#FFFFFF; --hi:#E7EEEA; --line:#DFE7E2;
  --k:#1E2421; --fg:#1E2421; --sub:#56605B; --dim:#87918C; --on:#FFFFFF;
  --y:#0FA37F; --y2:#2FC29A; --y-soft:#E2F5EE;
  --good:#16884A; --red:#E0353F; --orange:#C76A00;
  --shadow:0 6px 18px rgba(17,17,17,.07);
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{background:#E6ECE8;color:var(--fg);font-family:var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--k);outline-offset:2px}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
.app{max-width:440px;margin:0 auto;background:var(--bg);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;min-height:100%;border:1px solid var(--line)}
/* 앱바 */
#bar{background:var(--y);color:var(--on);display:grid;grid-template-columns:72px 1fr 72px;align-items:center;height:56px;padding:0 8px;position:sticky;top:0;z-index:5}
#bar h1{font-size:17px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb{height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.bb:last-child{justify-self:end}
.bb svg{width:24px;height:24px;stroke:var(--k);fill:none;stroke-width:2.4}
.bb.who{background:var(--k);color:var(--y);font-size:13px;font-weight:900;padding:0 10px;gap:4px;justify-self:start}
.bb.who small{font-weight:500;color:#fff;font-size:11px}
.qmark{width:30px;height:30px;border-radius:50%;background:var(--k);display:grid;place-items:center}
#screen{flex:1;display:flex;flex-direction:column;gap:14px;padding:0 0 20px;min-width:0}
/* 홈: TODAY */
.hello{background:var(--y);color:var(--on);padding:6px 20px 22px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:12px}
.hello small{font-size:12px;font-weight:900;letter-spacing:.1em}
.hello h2{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-top:-6px}
.bubble{align-self:flex-start;background:var(--paper);color:var(--fg);border-radius:16px 16px 16px 4px;padding:8px 14px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.stat3{color:var(--fg);display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:18px;padding:14px 6px;box-shadow:var(--shadow)}
.stat3 div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stat3 div+div{border-left:1px solid var(--line)}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-bottom:2px}
.ic svg{width:22px;height:22px;fill:none;stroke-width:2.4}
.stat3 div:nth-child(1) .ic{background:var(--k)} .stat3 div:nth-child(1) .ic svg{stroke:var(--y)}
.stat3 div:nth-child(2) .ic{background:var(--y)} .stat3 div:nth-child(2) .ic svg{stroke:var(--on)}
.stat3 div:nth-child(3) .ic{background:var(--y-soft);border:2px solid var(--k)} .stat3 div:nth-child(3) .ic svg{stroke:var(--k)}
.stat3 b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat3 small{font-size:11.5px;color:var(--sub);font-weight:500;letter-spacing:0}
.card,.box{background:var(--paper);border-radius:20px;padding:18px;margin:0 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h3,.box h3{font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.center{align-items:center;text-align:center}
.todaycard{display:flex;flex-direction:column;gap:12px}
.todaycard h2{font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
.todaycard h2 small{font-size:12px;color:var(--sub);font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols div{background:var(--bg);border-radius:14px;padding:10px 12px;text-align:right}
.cols small{display:block;text-align:left;font-size:12px;color:var(--sub)}
.cols b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.cols b.red{color:var(--red)}
.mixline{font-size:12.5px;color:var(--sub)}
.mixline b{color:var(--k)}
.startbtn{background:var(--k);color:var(--y);border-radius:14px;padding:14px;font-size:16px;font-weight:900}
.startbtn:disabled{opacity:.35}
.now{margin:0 16px;background:var(--k);color:#fff;border-radius:20px;padding:16px 16px 16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.now small{display:block;font-size:11.5px;color:#BDBDB5}
.now b{display:block;font-size:19px;font-weight:900;color:var(--y);margin:2px 0 8px}
.streak{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.streak i{width:12px;height:12px;border-radius:50%;border:2px solid #555}
.streak i.on{background:var(--y);border-color:var(--y)}
.streak em{font-style:normal;font-size:12px;color:#BDBDB5;margin-left:6px}
.now .qbtn .qmark{background:var(--y);width:38px;height:38px}
.areas{display:flex;gap:8px;overflow-x:auto;padding:2px 16px}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--paper);font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.chip small{font-weight:500;color:var(--sub)}
.chip.on{background:var(--k);color:var(--y)}
.chip.on small{color:#BDBDB5}
/* 단원 목록 */
.units{list-style:none;margin:0 16px;padding:0;background:var(--paper);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.units.in{margin:0;box-shadow:none;border:1px solid var(--line)}
.units li{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;border-bottom:1px solid var(--line)}
.units li:last-child{border-bottom:0}
.units li.cur{background:var(--y-soft)}
.units li.lock .unit{opacity:.45}
.unit{flex:1;min-width:0;text-align:left;padding:14px 0 14px 18px;display:flex;flex-direction:column;gap:3px}
.unit b{font-size:15px;font-weight:700}
.unit small{font-size:12px;color:var(--sub)}
.unit.static{cursor:default}
.mq{font-variant-numeric:tabular-nums}
.ansv{background:var(--y-soft);color:var(--y);font-weight:900;padding:0 6px;border-radius:4px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.tag.ok{background:#E3F2E9;color:var(--good)} .tag.due{background:#FDEBD2;color:var(--orange)} .tag.nowt{background:var(--k);color:var(--y)} .tag.lk{background:var(--hi);color:var(--dim)}
.tag.card,.tag.retry{background:var(--red);color:#fff} .tag.review{background:var(--k);color:var(--y)} .tag.new{background:var(--y);color:var(--on)}
.qbtn{flex:none;display:grid;place-items:center}
.x{color:var(--red);font-weight:700}
.note{font-size:12px;color:var(--sub);line-height:1.5}
#screen>.note{padding:0 20px}
/* 오답 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{border-radius:12px;padding:8px 2px;background:var(--bg)}
.cal div.t{background:var(--k);color:var(--y)}
.cal b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.cal span{font-size:11px;opacity:.75}
.btn{padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper)}
.btn.y{background:var(--y);color:var(--on);border-color:var(--y)}
.btn.k{background:var(--k);color:#fff;border-color:var(--k)}
.btn:disabled{opacity:.35}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.sp{justify-content:space-between}
/* 풀이 */
.np{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;flex:1;background:var(--paper)}
.prog{display:flex;align-items:center;gap:10px}
.prog .tr{flex:1;height:10px;border-radius:5px;background:var(--hi);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--y);transition:width .2s}
.prog span{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.ptag{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);justify-content:center;flex-wrap:wrap}
.toast{border-radius:14px;background:var(--k);color:var(--y);padding:10px 14px;font-weight:700;font-size:13.5px;text-align:center}
.res .toast{margin:0 16px}
.board{min-height:200px;border-radius:20px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 14px 18px;position:relative;text-align:center}
.board .q{font-size:clamp(30px,9.5vw,42px);font-weight:900;line-height:1.25;font-variant-numeric:tabular-nums;word-break:keep-all}
.board .q sup{font-size:.55em}
.board .q small{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:6px}
.board .ans{font-size:34px;font-weight:900;min-height:48px;min-width:140px;border-bottom:3px solid var(--k);font-variant-numeric:tabular-nums;padding:0 12px}
.board .ans.empty::after{content:"?";opacity:.25}
.board.ok{box-shadow:inset 0 0 0 3px var(--good)}
.board.no{box-shadow:inset 0 0 0 3px var(--red);background:#FFF1F1}
.fb{position:absolute;top:10px;left:12px;font-size:13px;font-weight:700;border-radius:8px;padding:4px 10px}
.fb.ok{background:var(--good);color:#fff}
.fb.no{background:var(--red);color:#fff;right:12px}
.fb:empty{display:none}
.tip{font-size:12.5px;color:var(--sub);line-height:1.5;text-align:center;min-height:19px}
.tip b{color:var(--k)}
.pad{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:auto}
.pad button{height:58px;background:var(--paper);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--hi)}
.pad .fn{background:#F1F1EB;font-size:16px;color:var(--sub)}
.pad .go{grid-column:4;grid-row:3 / span 2;height:auto;background:var(--y);color:var(--on);font-size:18px;font-weight:900}
.wrongbar{display:flex;gap:8px;margin-top:auto}
.wrongbar .btn{flex:1;padding:16px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;margin:0 2px;font-size:.78em}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor;padding-bottom:2px}
.fr i:last-child{padding-top:2px}
/* 개념 */
.cx{display:flex;flex-direction:column;gap:14px;padding:16px;flex:1}
.steps{display:flex;gap:6px}
.steps span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:7px 0;border-radius:999px;background:var(--hi);color:var(--dim)}
.steps span.on{background:var(--k);color:var(--y)}
.steps span.done{background:var(--y-soft);color:var(--y)}
.lyric{background:var(--paper);border-radius:20px;padding:22px 20px;min-height:300px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border-top:8px solid var(--y)}
.lyric .lk{font-size:12px;font-weight:700;color:var(--sub)}
.lyric h2{font-size:22px;font-weight:900;line-height:1.35}
.lyric p{font-size:17px;font-weight:500;line-height:1.6}
.lyric p.soft{font-size:14px;color:var(--sub)}
.lyric .ex{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--y-soft);border-radius:12px;padding:10px 14px;align-self:flex-start}
.lyric ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px;font-weight:700;line-height:1.5;cursor:pointer}
.lyric ol li.hide{color:var(--dim);font-weight:500}
.lyric .eqa{font-size:22px;font-weight:900;background:var(--k);color:var(--y);border-radius:10px;padding:6px 14px;align-self:flex-start}
.gate{font-size:12.5px;color:var(--sub);text-align:center}
/* 리포트 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 16px 0;background:var(--paper);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--y);color:var(--on)}
.datenav{display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.datenav button{width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1}
.datenav button:disabled{opacity:.25}
.ring{width:180px;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--sub)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.week{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:16px}
.week.month{gap:2px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.week i{width:100%;max-width:24px;border-radius:5px 5px 0 0;background:var(--k);min-height:2px}
.week i.td{background:var(--y)}
.week small{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;font-size:11px;color:var(--sub)}
.days span{flex:1;text-align:center}
.hbar{display:grid;grid-template-columns:88px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:10px;border-radius:5px;background:var(--hi);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--y)}
.hbar .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.list div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hi);font-size:14px;align-items:center}
.share{margin:0 16px;padding:14px;border-radius:14px;background:#FEE500;color:#191600;font-weight:900;text-align:center}
/* 결과 + 알림 */
.res{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.res>.btns{padding:0 16px}
.big{font-size:56px;font-weight:900;line-height:1;letter-spacing:-.03em;background:linear-gradient(transparent 60%,var(--y-soft) 60%);color:var(--y);padding:0 8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.cell{background:var(--paper);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.cell b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.cell span{font-size:11.5px;color:var(--sub)}
.dim{position:fixed;inset:0;background:rgba(17,17,17,.45);display:grid;place-items:center;z-index:20;padding:24px}
.dialog{background:var(--paper);border-radius:20px;padding:22px 22px 12px;max-width:320px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.dialog h3{font-size:17px;font-weight:900}
.dialog p{font-size:14.5px;line-height:1.7;color:var(--sub)}
.dialog p b{color:var(--k)}
.dialog button{align-self:flex-end;font-weight:900;padding:10px 16px;border-radius:10px;background:var(--y);color:var(--on)}
/* 탭 */
nav{display:grid;grid-template-columns:repeat(5,1fr);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
nav button{font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;padding:4px 0}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
nav button.on{color:var(--k);font-weight:900}
nav button.on{color:var(--y)}
nav button.on .tb{background:var(--y-soft)}
nav .tb{width:48px;height:30px;border-radius:15px;display:grid;place-items:center}
nav .dot{position:absolute;top:0;left:calc(50% + 10px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center;padding:0 4px}
svg.lucide{width:18px;height:18px;stroke-width:2.2;flex:none}
.btn,.startbtn,.share,.tag,.bb.who,.dialog h3,.steps span{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.bb svg.lucide{width:24px;height:24px;stroke:var(--on);stroke-width:2.4}
.bb.who svg.lucide{width:16px;height:16px;stroke:var(--y)}
.bb.who svg.sm{width:14px;height:14px;stroke:#BDBDB5}
.qmark svg.lucide{width:30px;height:30px;stroke:var(--y);stroke-width:2.2}
.now .qbtn .qmark svg.lucide{stroke:var(--on);width:38px;height:38px}
.tag svg.lucide{width:12px;height:12px;stroke-width:2.6}
nav .tb svg.lucide{width:22px;height:22px}
.ic svg.lucide{width:22px;height:22px}
.pad svg.lucide{width:22px;height:22px}
.pad .fn small{font-size:12px;margin-left:2px}
.pad .go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pad .go svg.lucide{width:26px;height:26px;stroke-width:2.6}
.datenav svg.lucide{width:22px;height:22px}
.steps svg.lucide{width:14px;height:14px}
.tip svg.inl{width:16px;height:16px;vertical-align:-3px}
.dialog h3 svg.lucide{stroke:var(--k)}
/* ===== 당근 앱 문법 덮어쓰기: 흰 앱바, 회색 띠로 나눈 납작한 섹션, 주황은 주요 행동에만 ===== */
#bar{background:var(--paper);color:var(--fg);border-bottom:1px solid var(--line);grid-template-columns:120px 1fr 120px}
#bar>.bb:first-child{justify-self:start;min-width:40px;width:40px;padding:0}
#bar>.bb.who:first-child{width:auto;padding:0 12px}
#bar>.bb:last-child{justify-self:end;width:40px;padding:0}
.bb.who,.bb.who *{white-space:nowrap}
.bb.who{gap:5px;padding:0 12px}
.bb.who small{font-size:12px}
.areas,.pills,.row{scrollbar-width:none}
.areas::-webkit-scrollbar,.pills::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
#bar h1{font-size:16px;font-weight:700}
.bb svg.lucide{stroke:var(--fg);stroke-width:2}
.bb.who{background:var(--bg);color:var(--fg);border-radius:999px;height:34px;font-weight:700}
.bb.who svg.lucide{stroke:var(--y)} .bb.who small{color:var(--sub)} .bb.who svg.sm{stroke:var(--dim)}
#screen{gap:8px;background:var(--bg);padding-bottom:16px}
.sec{background:var(--paper);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.sec.flush{padding:18px 0 4px;gap:10px}
.sh{font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;margin:0}
.sh small{font-size:12.5px;color:var(--sub);font-weight:400}
.pad16{padding:0 16px}
.hrow{display:flex;align-items:center;gap:8px}
.badge{background:var(--y);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;letter-spacing:.06em}
.paycard{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}

<script>
/* =========================================================
   학습 규칙 (조안호 국민연산 참고)
   - 기초(초1 덧셈)부터. 새 단계에 처음 들어가면 개념 설명을 끝까지 넘겨야 문제가 열림
   - 단계마다 연속 10문제 정답 → 다음 단계
   - 틀린 문제: 같은 세트 3문제 뒤 다시 + 오답노트(1일 → 3일 → 5일, 3번 연속 맞히면 졸업, 틀리면 1일로)
   - 통과 단계: 3~5일마다 복습 (다 맞으면 5일, 틀리면 3일)
   - 오늘 학습 20문제 = 오답 최대 10 → 단계 복습 최대 6 → 새 진도
   - 개념은 언제든: 앱바 ?, 오답 직후, 단원 목록·오답노트·결과의 ? 버튼
   ========================================================= */
const GOAL=10, SET=20, CARD_GAP=[1,3,5];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
const fix=n=>Math.round(n*10000)/10000;
function red(n,d){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); n/=g; d/=g; return d===1?String(n):`${n}/${d}`; }
const fr=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const sfr=(n,d)=> n<0?`−${fr(-n,d)}`:fr(n,d);
const par=n=> n<0?`(−${-n})`:String(n);
const sg=n=> n<0?`− ${-n}`:`+ ${n}`;
const P2=(q,a)=>({q:String(q).replace(/(^|[\s(=,:>])-(\d)/g,'$1−$2'),a:String(a)});

/* ---------- 34단계 + 개념 설명 ----------
   c: [핵심 개념 문장들], ex: 예제 식, st: 풀이 단계, ans: 답, tip: 기억할 점 */
const E=(q,st,ans)=>({q,st,ans});
const cop=d=>{let n;do{n=R(1,d-1);}while(gcd(n,d)>1);return n;};
const ST=(id,area,g,name,ex,gen,c,exs,tip)=>({id,area,g,name,ex,gen,c,exs,tip});
const STAGES=[
/* ===== 자연수 ===== */
ST('n1','자연수','초1','모으기와 가르기','7 = 3 + □',()=>{const a=R(3,10),b=R(1,a-1);return P2(`${a} = ${b} + □`,a-b);},
 ['수 하나를 두 수로 나누는 것을 가르기, 두 수를 합치는 것을 모으기라고 해요.','7은 3과 4로 가를 수 있어요.'],
 [E('7 = 3 + □',['3에서 7까지 이어 세요: 4, 5, 6, 7','4번 셌으니 □는 4'],'4'),E('10 = 6 + □',['6에서 10까지: 7, 8, 9, 10','4번 셌어요'],'4')],
 '손가락으로 큰 수를 펴고, 작은 수만큼 접으면 남은 손가락이 답이에요.'),
ST('n2','자연수','초1','9까지의 덧셈','3 + 5',()=>{const a=R(1,8),b=R(1,9-a);return P2(`${a} + ${b}`,a+b);},
 ['덧셈은 두 수를 모으는 거예요.','큰 수를 머릿속에 두고 작은 수만큼 이어 세면 빨라요.'],
 [E('3 + 5',['큰 수 5를 먼저 떠올려요','3만큼 이어 세요: 6, 7, 8'],'8'),E('2 + 6',['6에서 시작','7, 8'],'8')],
 '순서를 바꿔도 답이 같아요. 3 + 5 = 5 + 3'),
ST('n3','자연수','초1','9까지의 뺄셈','8 − 3',()=>{const a=R(2,9),b=R(1,a-1);return P2(`${a} − ${b}`,a-b);},
 ['뺄셈은 덜어 내는 거예요.','큰 수에서 작은 수만큼 거꾸로 세어요.'],
 [E('8 − 3',['8에서 거꾸로 3번: 7, 6, 5'],'5'),E('9 − 4',['9에서 거꾸로 4번: 8, 7, 6, 5'],'5')],
 '덧셈으로 확인해요. 5 + 3 = 8 이면 맞아요.'),
ST('n4','자연수','초1','10 만들기 (10의 짝꿍)','7 + □ = 10',()=>{const a=R(1,9);return P2(`${a} + □ = 10`,10-a);},
 ['더해서 10이 되는 두 수를 "10의 짝꿍"이라고 해요.','1과 9, 2와 8, 3과 7, 4와 6, 5와 5'],
 [E('7 + □ = 10',['7의 짝꿍을 떠올려요','7과 3이 만나면 10'],'3'),E('4 + □ = 10',['4의 짝꿍','4와 6'],'6')],
 '10의 짝꿍을 외워 두면 받아올림·받아내림이 아주 쉬워져요.'),
ST('n5','자연수','초1','10에서 빼기','10 − 6',()=>{const a=R(1,9);return P2(`10 − ${a}`,10-a);},

function val(s){ s=String(s).replace('−','-'); if(s.includes('/')){const [n,d]=s.split('/').map(Number);return d?n/d:NaN;} return parseFloat(s); }
function judge(input,ans){
  const v=val(input); if(isNaN(v)) return {ok:false};
  if(Math.abs(v-val(ans))>1e-9) return {ok:false};
  if(input.includes('/')){ const [n,d]=input.split('/').map(Number); if(gcd(n,d)>1||d===1) return {ok:false,msg:'값은 맞지만 기약분수로 써야 해요'}; }
  if(ans.includes('/')&&!input.includes('/')) return {ok:false,msg:'분수로 답해 주세요'};
  return {ok:true};
}

function dueStages(p){ return Object.entries(p.passed).filter(([,v])=>v.due<=today()).sort((a,b)=>a[1].due-b[1].due).map(([id])=>id); }
function plan(p){ const cards=dueCards(p).slice(0,10), rv=dueStages(p).slice(0,3).flatMap(id=>[id,id]); return {cards,rv,n:Math.max(4,SET-cards.length-rv.length),late:p.cards.filter(c=>c.due<today()).length}; }
function buildQueue(p,mode,arg){
  if(mode==='today'){ const pl=plan(p); return [...pl.cards.map(c=>({src:'card',card:c})),...pl.rv.map(id=>({src:'review',st:id})),...Array.from({length:pl.n},()=>({src:'new'}))]; }
  if(mode==='cards') return [...dueCards(p),...p.cards.filter(c=>c.due>today())].slice(0,15).map(c=>({src:'card',card:c}));

function mmS(ms){ const m=Math.round((ms||0)/60000); return m<60?`${m}분`:`${Math.floor(m/60)}시간 ${m%60}분`; }
function ring(pct,big,sub,col){ const r=52,C=2*Math.PI*r,d=Math.max(0,Math.min(1,pct))*C;
  return `<svg viewBox="0 0 140 140" class="ring" role="img" aria-label="${big} ${sub}"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--hi)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${col||'var(--y)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${d} ${C}" transform="rotate(-90 70 70)"/><text x="70" y="72" text-anchor="middle" font-size="30" font-weight="900" fill="var(--k)">${big}</text><text x="70" y="94" text-anchor="middle" font-size="11.5" fill="var(--sub)">${sub}</text></svg>`; }
const Q_ICON='<span class="pillq">개념</span>';
function setBar(title,{back,help}={}){
  const p=P();
  bar.innerHTML=`${back?`<button class="bb" id="bBack" aria-label="뒤로">${LI('arrow-left')}</button>`
    :`<button class="bb who" id="bWho" aria-label="학생 바꾸기">${LI('user-round')}${p.name}<small>${p.age}</small>${LI('chevrons-up-down','sm')}</button>`}
    <h1>${title}</h1>${help?`<button class="bb" id="bHelp" aria-label="개념 보기">${LI('circle-help')}</button>`:back?'<span class="bb"></span>':`<button class="bb cashbtn" id="bCash" aria-label="캐시 ${p.cash}, 꾸미기로"><span class="cashpill">${LI('coins')}${p.cash}</span></button>`}`;
  if(back) bar.querySelector('#bBack').onclick=back;
  else bar.querySelector('#bWho').onclick=()=>{ const ids=Object.keys(S.profiles); S.active=ids[(ids.indexOf(S.active)+1)%ids.length]; areaF=null; save(); render(); };
  if(help) bar.querySelector('#bHelp').onclick=help;
  const cb=bar.querySelector('#bCash'); if(cb) cb.onclick=()=>setTab('shop');
}
function showTabs(on){
  tabs.hidden=!on;
  if(!on) return;
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const n=dueCards(P()).length, b=tabs.querySelector('[data-tab="cards"]');
  b.querySelector('.dot')?.remove(); if(n) b.insertAdjacentHTML('beforeend',`<span class="dot">${n}</span>`);
}
function setTab(t){ tab=t; G=null; document.onkeydown=null; render(); screen.scrollTop=0; }
function render(){ showTabs(true); ({home:renderHome,cards:renderCards,report:renderReport,shop:renderShop,rank:renderRank})[tab](); }

/* ---------- 연산학습 (홈) ---------- */
function renderHome(){
  const p=P(), pl=plan(p), total=pl.cards.length+pl.rv.length+pl.n, done=Math.min((p.hist[today()]||{}).n||0,total);
  const cur=STAGES[p.stage]; if(!areaF) areaF=cur.area;
  setBar('연산학습');
  const list=STAGES.map((s,i)=>({...s,i})).filter(s=>s.area===areaF);
  const th=p.hist[today()]||{n:0,c:0,ms:0};
  screen.innerHTML=`
    <section class="sec">
      <button class="mebar" id="me">${avatarSVG(p.eq,56)}<div><b>${p.name}</b>${gradeChip(p.xp)}</div><span class="note">꾸미기</span>${LI('chevron-right')}</button>
      <div class="hrow"><span class="badge">TODAY</span><span class="sub">${dlabel(today())} · ${p.name}의 학습</span></div>
      <div class="paycard">
        <div class="pc-top"><span class="pc-logo">${LI('calculator')}</span><b>오늘 학습</b>${pl.late?`<span class="latepill">밀린 학습 ${pl.late}건</span>`:''}</div>
        <div class="pc-amt">${done}<small> / ${total}문제</small></div>
        <p class="mixline">오답 다시 <b>${pl.cards.length}</b> · 단계 복습 <b>${pl.rv.length}</b> · 새 진도 <b>${pl.n}</b></p>
        <div class="pc-btns"><button class="gbtn" id="goCards">오답만</button><button class="gbtn" id="goNew">진도만</button><button class="kbtn" id="go">${LI('play')}${done?'이어서':'시작'}</button></div>
      </div>
      <div class="shortcuts">
        <button data-sc="cards"><span>${LI('notebook-pen')}</span>오답노트</button>
        <button data-sc="concept"><span>${LI('book-open')}</span>개념 보기</button>
        <button data-sc="speed"><span>${LI('zap')}</span>스피드 게임</button>
        <button data-sc="report"><span>${LI('chart-pie')}</span>학습결과</button>
      </div>
    </section>
    <section class="sec">
      <h3 class="sh">오늘 기록</h3>
      <div class="stat3">
        <div><span class="ic">${IC.list}</span><b>${th.n}개</b><small>푼 문제</small></div>
        <div><span class="ic">${IC.clock}</span><b>${mmS(th.ms)}</b><small>학습 시간</small></div>
        <div><span class="ic">${IC.check}</span><b>${th.n?Math.round(th.c/th.n*100):0}%</b><small>정답률</small></div>
      </div>
    </section>
    <section class="sec">
      <h3 class="sh">지금 단계 <small>${cur.g} · ${p.stage+1}/${STAGES.length}단계</small></h3>
      <div class="nowrow">
        <span class="lic s-now">${LI('pencil')}</span>
        <div class="nr-body"><b>${cur.name}</b>
          <span class="streak">${p.read[cur.id]?Array.from({length:GOAL},(_,i)=>`<i class="${i<p.streak?'on':''}"></i>`).join('')+`<em>연속 ${p.streak}/${GOAL}</em>`:'<em>개념 설명을 먼저 읽어요</em>'}</span></div>
        <button class="qbtn" data-q="${cur.id}" aria-label="${cur.name} 개념">${Q_ICON}</button>
      </div>
    </section>
    <section class="sec flush">
      <h3 class="sh pad16">단원 목록</h3>
    <div class="areas">${AREAS.map(a=>{const ss=STAGES.filter(s=>s.area===a);const n=ss.filter(s=>p.passed[s.id]).length;return `<button class="chip ${a===areaF?'on':''}" data-af="${a}">${a} <small>${n}/${ss.length}</small></button>`;}).join('')}</div>
    <ul class="units">${list.map(s=>{
      const ps=p.passed[s.id], now=s.i===p.stage, lock=!ps&&!now, due=ps&&ps.due<=today();
      const st=ps?(due?`<span class="tag due">${LI('repeat')}복습 차례</span>`:`<span class="tag ok">${LI('check')}통과</span>`):now?`<span class="tag nowt">${LI('pencil')}학습 중</span>`:`<span class="tag lk">${LI('lock')}잠김</span>`;
      const sub=ps?`최근 평균 ${avg(s.id)} · 다음 복습 ${rel(ps.due)}`:now?`난이도 ${LV(s.id,p)} · 문제 ${((p.bp||{})[s.id]||0)+1}/${BANK[s.id].length} · 연속 ${p.streak}/${GOAL}`:`${s.g} · 예) ${s.ex}`;
      const li=ps?(due?`<span class="lic s-due">${LI('repeat')}</span>`:`<span class="lic s-ok">${LI('check')}</span>`):now?`<span class="lic s-now">${LI('pencil')}</span>`:`<span class="lic s-lk">${LI('lock')}</span>`;
      return `<li class="${now?'cur':''} ${lock?'lock':''}">${li}<button class="unit" data-st="${s.id}" ${lock?'disabled':''}><b>${s.name}</b><small>${sub}</small></button>${st}<button class="qbtn" data-q="${s.id}" aria-label="${s.name} 개념">${Q_ICON}</button></li>`;}).join('')}</ul>
    </section>
    <p class="note">민왕(초5)·서윤(초3)과 그동안의 기록은 예시 데이터예요. 학습결과 탭에서 하루를 넘겨 1·3·5일 반복을 시연할 수 있어요.</p>`;
  screen.querySelector('#go').onclick=()=>start('today','오늘 학습');
  screen.querySelector('#me').onclick=()=>setTab('shop');
  screen.querySelector('#goCards').onclick=()=>{ if(P().cards.length) start('cards','오답 다시'); };
  screen.querySelector('#goNew').onclick=()=>start('new',STAGES[P().stage].name);
  screen.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sc;
    if(k==='cards'||k==='report') setTab(k);
    else if(k==='speed'){ if(gameBlock(P())) setTab('rank'); else start('speed','스피드 게임'); }
    else if(k==='concept') openConcept(STAGES[P().stage].id,()=>render());
    else document.getElementById('bWho').click(); });
  screen.querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>{areaF=b.dataset.af;renderHome();});
  screen.querySelectorAll('.unit:not(:disabled)').forEach(b=>b.onclick=()=>{
    const id=b.dataset.st; if(IDX[id]===P().stage) start('new',STAGES[IDX[id]].name); else start('stage',STAGES[IDX[id]].name,id);
  });
  screen.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openConcept(b.dataset.q,()=>render()));
}
function openConcept(id,back){
  const p=P(), i=IDX[id], unlocked=p.passed[id]||i===p.stage;
  concept(id,false,back, unlocked?()=>{ if(i===p.stage) start('new',STAGES[i].name); else start('stage',STAGES[i].name,id); }:null);
}

/* ---------- 오답노트 ---------- */
function renderCards(){
  const p=P(), t=today();
  setBar('오답노트');
  const cal=Array.from({length:7},(_,i)=>{const d=t+i;const n=p.cards.filter(c=>i===0?c.due<=d:c.due===d).length;return `<div class="${i===0&&n?'t':''}"><span>${i===0?'오늘':DOW[new Date(d*864e5).getUTCDay()]}</span><b>${n}</b></div>`;}).join('');
  const sorted=[...p.cards].sort((a,b)=>(a.due-b.due)||(b.wrong-a.wrong));
  screen.innerHTML=`
    <section class="card"><div class="todaycard">
      <h2>오늘 다시 풀 오답 <small>틀리면 1일 → 3일 → 5일 뒤</small></h2>
      <div class="cols"><div><small>오늘</small><b class="${dueCards(p).length?'red':''}">${dueCards(p).length}건</b></div><div><small>전체 / 졸업</small><b>${p.cards.length} / ${p.grad}</b></div></div>
      <button class="startbtn" id="go" ${p.cards.length?'':'disabled'}>${LI('rotate-ccw')}오답만 풀기</button></div></section>
    <div class="box"><h3>다시 나오는 날</h3><div class="cal">${cal}</div><p class="note">세 번 연속 맞히면 졸업, 중간에 틀리면 1일로 돌아가요.</p></div>
    <ul class="units">${sorted.length?sorted.map(c=>`<li><div class="unit static"><b class="mq">${plain(c.q)} = <span class="ansv">${show(c.a)}</span></b>
      <small><span class="x">✕${c.wrong}</span> · ${STAGES[IDX[c.st]].name} · <span class="${c.due<=t?'x':''}">${rel(c.due)}</span> · 졸업까지 ${3-c.box}번</small></div>
      <button class="qbtn" data-q="${c.st}" aria-label="개념">${Q_ICON}</button></li>`).join(''):'<li><div class="unit static"><b>오답이 없어요</b><small>전부 졸업했어요</small></div></li>'}</ul>`;
  screen.querySelector('#go').onclick=()=>{ if(P().cards.length) start('cards','오답 다시'); };
  screen.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openConcept(b.dataset.q,()=>render()));
}

/* ---------- 리포트 (일별·주간·월간) ---------- */
let rmode='day', rshift=0;
function renderReport(){
  const p=P(), t=today();
  setBar('학습결과');
  const span=rmode==='day'?1:rmode==='week'?7:30;
  const endD=t-rshift*span, days=Array.from({length:span},(_,i)=>endD-span+1+i);
  const hs=days.map(d=>p.hist[d]||{n:0,c:0,ms:0});
  const tot=hs.reduce((a,h)=>({n:a.n+h.n,c:a.c+h.c,ms:a.ms+(h.ms||0)}),{n:0,c:0,ms:0});
  const att=hs.filter(h=>h.n).length, rate=tot.n?Math.round(tot.c/tot.n*100):0;
  const label=rmode==='day'?dlabel(endD):`${dlabel(days[0])} ~ ${dlabel(endD)}`;
  const goalN=SET*span, goalMs=span*15*60000;
  const by={}; p.cards.forEach(c=>{by[c.st]=(by[c.st]||0)+c.wrong;});
  const worst=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const mx=Math.max(SET,...hs.map(h=>h.n));
  screen.innerHTML=`
    <div class="seg">${[['day','일별 보고서'],['week','주간 보고서'],['month','월간 보고서']].map(([k,l])=>`<button data-rm="${k}" class="${k===rmode?'on':''}">${l}</button>`).join('')}</div>
    <div class="datenav"><button id="prevD" aria-label="이전">${LI('chevron-left')}</button><span>${label}</span><button id="nextD" aria-label="다음" ${rshift===0?'disabled':''}>${LI('chevron-right')}</button></div>
    <section class="card center">
      ${ring(tot.n/goalN, tot.n+'개','총 문제 개수')}
      <div class="legend"><span><i style="background:var(--y)"></i>정답 ${tot.c}개</span><span><i style="background:var(--red)"></i>오답 ${tot.n-tot.c}개</span><span>정답률 ${rate}%</span></div>
    </section>
    <section class="card center">
      ${ring(tot.ms/goalMs, mmS(tot.ms),'총 학습 시간','var(--k)')}
      <p class="note">${rmode==='day'?'하루 목표 15분':`${span}일 중 ${att}일 출석 · 하루 목표 15분`}</p>
    </section>
    ${rmode!=='day'?`<section class="card"><h3>하루 푼 문제</h3>
      <div class="week ${rmode}">${hs.map((h,i)=>`<div><small>${rmode==='week'&&h.n?h.n:''}</small><i class="${days[i]===t?'td':''}" style="height:${h.n/mx*100}%"></i></div>`).join('')}</div>
      ${rmode==='week'?`<div class="days">${days.map(d=>`<span>${d===t?'오늘':DOW[new Date(d*864e5).getUTCDay()]}</span>`).join('')}</div>`:''}</section>`:''}
    <section class="card"><h3>영역별 정답률 <small class="note">누적</small></h3>${AREAS.map(a=>{const s=p.stat[a]||{n:0,c:0};const r=s.n?Math.round(s.c/s.n*100):0;return `<div class="hbar"><span>${a}</span><div class="tr"><i style="width:${r}%"></i></div><span class="v">${s.n?r+'%':'—'}</span></div>`;}).join('')}</section>
    <section class="card"><h3>많이 틀리는 단계</h3><div class="list">${worst.length?worst.map(([id,w])=>`<div><span>${STAGES[IDX[id]].g} ${STAGES[IDX[id]].name}</span><span class="x">✕${w}</span></div>`).join(''):'<p class="note">틀린 문제가 없어요.</p>'}</div></section>
    <button class="share" id="share">${LI('message-circle')}카카오톡으로 보고서 보내기</button>
    <p class="note" id="shareNote">공유는 출시 버전에서 동작해요. 지금은 보낼 문구를 복사해요.</p>
    <section class="card"><h3>시연 도구</h3><p class="note">하루를 넘기면 1·3·5일 뒤 오답과 3~5일 단계 복습이 다시 나와요.</p>
      <div class="btns"><button class="btn k" id="nextDay">${LI('calendar-plus')}하루 넘기기</button><button class="btn" id="markDone">${LI('calendar-check')}오늘 학습 완료로 표시</button><button class="btn" id="reset">${LI('rotate-ccw')}예시로 되돌리기</button></div></section>`;
  screen.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{rmode=b.dataset.rm;rshift=0;renderReport();});
  screen.querySelector('#prevD').onclick=()=>{rshift++;renderReport();};
  screen.querySelector('#nextD').onclick=()=>{if(rshift>0){rshift--;renderReport();}};
  screen.querySelector('#share').onclick=async()=>{
    const txt=`[셈하루] ${p.name} ${label}: ${tot.n}문제, 정답률 ${rate}%, 학습 ${mmS(tot.ms)}. 지금 단계: ${STAGES[p.stage].name}. 남은 오답 ${p.cards.length}건.`;
    const n=screen.querySelector('#shareNote'); try{await navigator.clipboard.writeText(txt);n.textContent='복사했어요: '+txt;}catch(e){n.textContent=txt;}
  };
  screen.querySelector('#nextDay').onclick=()=>{S.offset++;save();render();};
  screen.querySelector('#markDone').onclick=()=>{ p.daily=p.daily||{}; p.daily[today()]=1; save(); toastMsg('오늘 학습 완료로 표시했어요. 랭킹 탭에서 게임이 열려요'); };
  screen.querySelector('#reset').onclick=e=>{ if(e.currentTarget.dataset.c){S=seed();ensureSst();ensureReward();areaF=null;save();render();} else {e.currentTarget.dataset.c=1;e.currentTarget.textContent='한 번 더 누르면 초기화';} };
}

/* ---------- 꾸미기 (아바타 상점) ---------- */
let shopCat='hat', shopSel=null;
function renderShop(){
  const p=P(); setBar('꾸미기');
  const gk=gradeOf(p.xp), nx=GRADES[gk+1];
  const items=AVI[shopCat], sel=shopSel&&shopSel.cat===shopCat?items.find(i=>i.id===shopSel.id):null;
  const preview={...p.eq}; if(sel) preview[shopCat]=sel.id;
  const own=it=>p.owned.includes(shopCat+':'+it.id)||it.p===0;
  let act='';
  if(sel){
    if(p.eq[shopCat]===sel.id) act=`<button class="okbtn" disabled>착용 중</button>`;
    else if(own(sel)) act=`<button class="okbtn" id="wear">${LI('shirt')}착용하기</button>`;
    else if(sel.g&&gk<sel.g) act=`<button class="okbtn" disabled>${LI('lock')}'${GRADES[sel.g].n}' 등급부터 살 수 있어요</button>`;
    else if(p.cash<sel.p) act=`<button class="okbtn" disabled>캐시가 ${sel.p-p.cash} 부족해요</button>`;
    else act=`<button class="okbtn" id="buy">${LI('coins')}${sel.p}캐시로 사고 착용하기</button>`;
  }
  screen.innerHTML=`
    <section class="sec center shopTop">
      <div class="avbig">${avatarSVG(preview,150)}</div>
      <div class="hrow">${gradeChip(p.xp)}<span class="cashpill big">${LI('coins')}${p.cash}</span></div>
      <div class="gbar"><div class="tr"><i style="width:${nx?Math.round((p.xp-GRADES[gk].x)/(nx.x-GRADES[gk].x)*100):100}%"></i></div>
        <small>${nx?`'${nx.n}' 등급까지 ${nx.x-p.xp} XP · 문제 1개 맞히면 1 XP`:'최고 등급이에요'}</small></div>
    </section>
    <section class="sec flush">
      <div class="areas">${CATS.map(([k,l])=>`<button class="chip ${k===shopCat?'on':''}" data-cat="${k}">${l}</button>`).join('')}</div>
      <div class="itemgrid">${items.map(it=>{ const e={...p.eq,[shopCat]:it.id}, mine=own(it), lock=it.g&&gk<it.g;
        return `<button class="item ${sel&&sel.id===it.id?'sel':''} ${p.eq[shopCat]===it.id?'on':''}" data-it="${it.id}">${avatarSVG(e,64)}<b>${it.name}</b>
          <small>${p.eq[shopCat]===it.id?'착용 중':mine?'가지고 있어요':lock?`${LI('lock')}${GRADES[it.g].n} 등급`:`${LI('coins')}${it.p}`}</small></button>`; }).join('')}</div>
      ${act?`<div class="shopact">${act}</div>`:''}
    </section>
    <section class="sec"><h3 class="sh">캐시 모으는 법</h3>
      <ul class="earnlist">
        <li><span>${LI('check')}정답 1개</span><b>+1</b></li><li><span>${LI('flame')}5문제 연속 정답</span><b>+3</b></li>
        <li><span>${LI('graduation-cap')}오답 졸업</span><b>+5</b></li><li><span>${LI('calendar-check')}오늘 학습 끝내기</span><b>+10</b></li>
        <li><span>${LI('trophy')}단계 통과</span><b>+20</b></li></ul>
      <p class="note">하루에 최대 ${CASH_CAP}캐시까지 모을 수 있어요. 캐시는 공부로만 모아요.</p></section>`;
  screen.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{shopCat=b.dataset.cat;shopSel=null;renderShop();});
  screen.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{shopSel={cat:shopCat,id:b.dataset.it};renderShop();});
  const w=screen.querySelector('#wear'); if(w) w.onclick=()=>{ p.eq[shopCat]=sel.id; save(); renderShop(); };
  const by=screen.querySelector('#buy'); if(by) by.onclick=()=>{ p.cash-=sel.p; p.owned.push(shopCat+':'+sel.id); p.eq[shopCat]=sel.id; save(); toastMsg(`${sel.name}을(를) 샀어요!`); renderShop(); };
}
function toastMsg(t){ const el=document.createElement('div'); el.className='flash'; el.textContent=t; document.querySelector('.app').appendChild(el); setTimeout(()=>el.remove(),1600); }

/* ---------- 랭킹 · 스피드 게임 · 대결방(준비 중) ---------- */

/* ---------- 개념 설명 ---------- */
function concept(id,gate,onClose,onPractice){
  showTabs(false);
  const s=STAGES[IDX[id]], p=P();
  let i=0, shown=0; const total=s.exs.length+2;
  const draw=()=>{
    setBar(`개념 · ${s.name}`,{back:()=>{ if(gate&&G){G=null;document.onkeydown=null;} save(); onClose&&onClose(); }});
    let body='';
    if(i===0) body=`<span class="lk">${s.g} · ${s.area}</span><h2>${s.name}</h2>${s.c.map(t=>`<p>${t}</p>`).join('')}`;
    const ex=i>0&&i<total-1?s.exs[i-1]:null;
    if(ex) body=`<span class="lk">예제 ${i} / ${s.exs.length}</span><div class="ex">${ex.q}</div><ol>${ex.st.map((t,k)=>`<li class="${k<shown?'':'hide'}">${k<shown?t:'눌러서 다음 줄 보기'}</li>`).join('')}</ol>${shown>=ex.st.length?`<span class="eqa">답: ${ex.ans}</span>`:''}`;
    if(i===total-1) body=`<span class="lk">기억할 점</span><h2>${s.tip}</h2><p class="soft">${gate?`이제 문제를 풀어요. 쉬운 문제부터 시작해서 잘 맞히면 점점 어려워져요. 어려운 문제까지 올라가 연속 ${GOAL}문제를 맞히면 다음 단계로 넘어가고, 틀린 문제는 오답노트에 들어가 1·3·5일 뒤 다시 나와요.`:'틀린 문제는 오답노트에 들어가 1·3·5일 뒤 다시 나와요.'}</p>`;
    const stepLocked=!!ex&&shown<ex.st.length, last=i===total-1;
    screen.innerHTML=`<div class="cx">
      <div class="steps">${[['lightbulb','개념'],...s.exs.map((_,k)=>['pencil-line','예제 '+(k+1)]),['bookmark','기억']].map(([ic,t],k)=>`<span class="${k===i?'on':k<i?'done':''}">${LI(k<i?'check':ic)}${t}</span>`).join('')}</div>
      <div class="lyric" id="ly">${body}</div>
      <div class="btns sp">
        <button class="btn" id="prev" ${i===0?'disabled':''}>${LI('chevron-left')}이전</button>
        ${last?(gate?`<button class="btn y" id="done">${LI('circle-check-big')}다 읽었어요 · 문제 풀기</button>`:`${onPractice?`<button class="btn y" id="prac">${LI('play')}이 단계 문제 풀기</button>`:''}<button class="btn k" id="done">닫기</button>`)
              :`<button class="btn k" id="next">${stepLocked?'풀이 한 줄 보기':'다음'}${LI(stepLocked?'chevron-down':'chevron-right')}</button>`}
      </div>
      ${gate?`<p class="gate">${last?'다 읽으면 문제가 열려요':`처음 들어가는 단계예요. 설명을 끝까지 넘겨야 문제가 열려요 (${i+1}/${total})`}</p>`:''}
    </div>`;
    screen.querySelector('#prev').onclick=()=>{i--;shown=0;draw();};
    const nx=screen.querySelector('#next'); if(nx) nx.onclick=()=>{ if(ex&&shown<ex.st.length) shown++; else {i++;shown=0;} draw(); };
    if(ex) screen.querySelector('#ly').onclick=()=>{ if(shown<ex.st.length){shown++;draw();} };
    const dn=screen.querySelector('#done'); if(dn) dn.onclick=()=>{ if(gate){p.read[id]=true;save();} onClose&&onClose(true); };
    const pr=screen.querySelector('#prac'); if(pr) pr.onclick=()=>onPractice();
  };
  draw();
}

/* ---------- 풀이 ---------- */
function start(mode,title,arg){
  if(mode==='speed'){ const why=gameBlock(P()); if(why){ toastMsg(why.msg); if(tab==='rank') renderRank(); return; } }
  const p=P(), q=buildQueue(p,mode,arg); if(mode==='speed'){ gameState(p).played++; save(); } if(!q.length) return;
  G={mode,title,arg,q,i:0,input:'',cur:null,t0:0,lock:false,log:[],passedNow:[],reviewed:{},toast:'',began:performance.now(),away:0,wrongWait:false,combo:0,earned:0};
  if(mode==='speed'){ const gg=G; gg.end=performance.now()+60000; gg.tm=setInterval(()=>{ if(G!==gg){clearInterval(gg.tm);return;} const left=Math.max(0,Math.ceil((gg.end-performance.now())/1000)); const el=screen.querySelector('#spd'); if(el) el.textContent=left+'초'; const br=screen.querySelector('.prog .tr i'); if(br) br.style.width=(left/60*100)+'%'; if(left<=0&&!gg.lock){ clearInterval(gg.tm); finish(); } },200); }
  document.onkeydown=e=>{ if(!G) return; if(G.wrongWait){ if(e.key==='Enter') nextAfterWrong(); return; } if(!G.cur) return; if(G.cur.mode==='choice'){ const b=screen.querySelector(`[data-c="${+e.key-1}"]`); if(b) b.click(); return; }
    if(/^[0-9]$/.test(e.key))press(e.key); else if(['.','/','-'].includes(e.key))press(e.key); else if(e.key==='Backspace')press('del'); else if(e.key==='Enter')press('ok'); };
  advance();
}
function advance(){
  if(G.mode==='speed'&&performance.now()>=G.end) return finish();
  const g=G, p=P(), it=g.q[g.i], sid=STAGES[p.stage].id;
  if(it.src==='new'&&!p.read[sid]){
    g.cur=null; const t0=performance.now();
    return concept(sid,true,ok=>{ if(ok&&G===g){ g.away+=performance.now()-t0; advance(); } else { G=null; render(); } });
  }
  const base=resolve(it,p), early=it.src==='new'&&(base.pos||0)<3;
  g.cur={...it,...base,base:{q:base.q,a:base.a,st:base.st},...vary(base,g,early)}; g.input=''; g.t0=performance.now(); drawPlay();
}
const SRC={card:'오답 다시',review:'단계 복습',new:'새 진도',retry:'방금 틀린 문제',speed:'스피드'};
function drawPlay(){
  showTabs(false);
  const g=G,p=P(),c=g.cur,s=STAGES[IDX[c.st]];
  setBar(g.title,{back:()=>{G=null;document.onkeydown=null;save();render();},help:()=>openFromPlay(s.id)});
  screen.innerHTML=`<div class="np">
    <div class="prog"><div class="tr"><i style="width:${g.mode==='speed'?Math.max(0,(g.end-performance.now())/600):g.i/g.q.length*100}%"></i></div><span id="spd">${g.mode==='speed'?Math.max(0,Math.ceil((g.end-performance.now())/1000))+'초':`${g.i+1} / ${g.q.length}`}</span></div>${g.mode==='speed'?`<div class="spdscore">맞힌 문제 <b>${g.log.filter(r=>r.ok).length}</b> · 최고 ${P().speedBest}</div>`:''}
    ${g.toast?`<div class="toast">${g.toast}</div>`:''}
    <div class="ptag">${c.src==='new'?`<span class="lvl l-${LV(s.id,p)}">${LV(s.id,p)}</span>`:`<span class="lvl src">${SRC[c.src]}</span>`}${KIND[c.kind]?`<span class="lvl kind">${KIND[c.kind]}</span>`:''}<span>${s.g} ${s.name}${c.src==='new'?` · 연속 ${p.streak}/${GOAL}`:''}</span></div>
    <div class="board" id="board"><span class="fb" id="fb"></span><div class="q">${c.q}</div>${c.mode==='choice'?'':'<div class="ans empty" id="ans"></div>'}</div>
    <p class="tip" id="tip">모르면 오른쪽 위 ${LI('circle-help','inl')}를 눌러 개념을 볼 수 있어요.</p>
    ${c.mode==='choice'?`<div class="choices c${c.choices.length}" id="pad">${c.choices.map((o,k)=>`<button data-c="${k}" class="${c.kind==='ox'?(o.v==='O'?'o':'x'):''}">${c.kind==='ox'?`<b>${o.v}</b>`:''}<span>${o.label}</span></button>`).join('')}</div>`:`<div class="pad2" id="pad">
      <div class="padtools"><button data-k="-">${LI('minus')}음수</button><button data-k="/">${LI('slash')}분수</button><button data-k=".">${LI('dot')}소수점</button></div>
      <div class="pad">${['1','2','3','4','5','6','7','8','9','clr','0','del'].map(k=>`<button data-k="${k}" aria-label="${{del:'한 칸 지우기',clr:'전체 지우기'}[k]||k}" class="${k==='clr'?'fn':''}">${{del:LI('arrow-left'),clr:'지우기'}[k]||k}</button>`).join('')}</div>
      <button data-k="ok" class="okbtn">입력</button>
    </div>`}
  </div>`;
  g.toast='';
  screen.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  screen.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ if(g.lock) return; g.input=c.choices[+b.dataset.c].v; b.classList.add('picked'); check(); });
}
function openFromPlay(id){
  const g=G; if(!g) return; const keep=g.cur, inp=g.input, wasWrong=g.wrongWait, t0=performance.now(); g.cur=null;
  concept(id,false,()=>{ if(G!==g) return; g.away+=performance.now()-t0; g.cur=keep;
    if(wasWrong) return nextAfterWrong();
    drawPlay(); g.input=inp; const a=screen.querySelector('#ans'); a.textContent=inp.replace('-','−'); a.classList.toggle('empty',!inp); });
}
function nextAfterWrong(){ const g=G; g.wrongWait=false; g.lock=false; g.i++; if(g.i>=g.q.length) return finish(); advance(); }
function press(k){
  const g=G; if(!g||g.lock||!g.cur) return;
  if(k==='del') g.input=g.input.slice(0,-1);
  else if(k==='clr') g.input='';
  else if(k==='ok'){ if(g.input&&g.input!=='-') return check(); }
  else if(k==='-') g.input=g.input.startsWith('-')?g.input.slice(1):'-'+g.input;
  else if((k==='.'||k==='/')&&(g.input.includes(k)||!/\d$/.test(g.input))) return;
  else if(g.input.length<9) g.input+=k;
  const a=screen.querySelector('#ans'); a.textContent=g.input.replace('-','−'); a.classList.toggle('empty',!g.input);
}
function check(){
  const g=G,p=P(),c=g.cur,t=today(),s=STAGES[IDX[c.st]];
  const j=c.mode==='choice'?{ok:g.input===c.a}:judge(g.input,c.a), ok=j.ok;
  p.stat[s.area]=p.stat[s.area]||{n:0,c:0}; p.stat[s.area].n++; if(ok)p.stat[s.area].c++;
  const h=p.hist[t]=p.hist[t]||{n:0,c:0,ms:0}; h.n++; if(ok)h.c++; h.ms=(h.ms||0)+Math.min(performance.now()-g.t0,60000);
  g.log.push({q:c.base.q,a:c.base.a,you:g.input,ok,src:c.src,st:c.st});
  if(ok){ g.combo++; const E2=n=>c.src==='speed'?earnGame(p,g,n):earn(p,g,n); g.gain=E2(1)+(g.combo%5===0?E2(3):0); addXP(p,g,1); } else { g.combo=0; g.gain=0; }
  if(c.src==='card'){ const cd=c.card;
    if(ok){ cd.box++; if(cd.box>=3){ p.cards=p.cards.filter(x=>x!==cd); p.grad++; earn(p,g,5); g.toast='오답 졸업! +5캐시'; } else cd.due=t+CARD_GAP[cd.box]; }
    else { cd.box=0; cd.due=t+1; cd.wrong++; } }
  if(c.src==='review'){ const r=g.reviewed[c.st]=g.reviewed[c.st]||{n:0,w:0}; r.n++; if(!ok){r.w++; addCard(p,c.base);} }
  if(c.src==='new'){
    p.bp=p.bp||{}; const bl=BANK[s.id].length, pos=p.bp[s.id]||0;
    p.bp[s.id]=ok?Math.min(bl-1,pos+(p.streak>=2?2:1)):Math.max(0,pos-2);
    if(ok){ p.streak++; if(p.streak>=GOAL&&p.bp[s.id]>=Math.floor(bl*2/3)&&p.stage<STAGES.length-1){ p.passed[s.id]={due:t+3}; g.passedNow.push(s.name); p.stage++; p.streak=0; areaF=null; earn(p,g,20); g.toast=`${s.name} 통과! +20캐시 · 다음 단계는 개념 설명부터 시작해요`; } }
    else { p.streak=0; addCard(p,c.base); } }
  if(!ok&&c.src!=='retry'&&c.src!=='speed') g.q.splice(Math.min(g.i+4,g.q.length),0,{src:'retry',q:c.base.q,a:c.base.a,st:c.st});
  if(g.gradeUp){ g.toast=`등급 업! '${g.gradeUp}' 등급이 되었어요`; g.gradeUp=null; }
  save();
  const b=screen.querySelector('#board'),fb=screen.querySelector('#fb'); b.classList.add(ok?'ok':'no');
  fb.className='fb '+(ok?'ok':'no'); fb.innerHTML=ok?`정답!${g.gain?` <span class="coin">+${g.gain}</span>`:''}${g.combo%5===0?' 5연속!':''}`:(j.msg||`정답은 ${show(c.a)} · 3문제 뒤 다시 나와요`);
  g.lock=true;
  if(!ok&&c.src!=='speed'){
    g.wrongWait=true;
    screen.querySelector('#tip').innerHTML=`<b>기억할 점</b> ${s.tip}`;
    screen.querySelector('#pad').outerHTML=`<div class="wrongbar"><button class="btn k" id="seeCx">${LI('book-open')}개념 보기</button><button class="btn y" id="goOn">다음 문제${LI('arrow-right')}</button></div>`;
    screen.querySelector('#seeCx').onclick=()=>openFromPlay(s.id);
    screen.querySelector('#goOn').onclick=()=>nextAfterWrong();
    return;
  }
  setTimeout(()=>{ if(G!==g) return; g.lock=false; g.i++; if(g.i>=g.q.length) return finish(); advance(); },ok?350:800);
}
function mmss(ms){ const s=Math.round(ms/1000); return s<60?`${s}초`:`${Math.floor(s/60)}분 ${s%60}초`; }
function finish(){
  const g=G,p=P(),t=today(); G=null; document.onkeydown=null; if(g.tm) clearInterval(g.tm);
  Object.entries(g.reviewed).forEach(([id,r])=>{ if(p.passed[id]) p.passed[id].due=t+(r.w?3:5); });
  const per={}; g.log.filter(r=>r.src!=='retry'&&r.src!=='speed').forEach(r=>{ const o=per[r.st]=per[r.st]||{n:0,c:0}; o.n++; if(r.ok)o.c++; });
  Object.entries(per).forEach(([id,o])=>{ const a=p.sst[id]=p.sst[id]||[]; a.push(Math.round(o.c/o.n*100)); if(a.length>3)a.shift(); });
  const cOK=g.log.filter(r=>r.ok).length;
  p.daily=p.daily||{}; if(g.mode==='today'&&g.log.length>=10&&!p.daily[t]){ p.daily[t]=1; earn(p,g,10); g.bonusDay=true; }
  if(g.mode==='cards'&&g.log.length>=5&&!gameState(p).cardBonus){ gameState(p).cardBonus=true; gameState(p).extra++; g.extraPlay=true; }
  if(g.mode==='speed'&&cOK>p.speedBest){ p.speedBest=cOK; earnGame(p,g,5); g.best=true; }
  save(); tab=g.mode==='speed'?'rank':'home'; showTabs(true);
  const n=g.log.length,c=g.log.filter(r=>r.ok).length, wrong=g.log.filter(r=>!r.ok&&r.src!=='retry'), rv=Object.entries(g.reviewed);
  const time=mmss(performance.now()-g.began-g.away);
  setBar(g.title+' 결과');
  screen.innerHTML=`<div class="res">
    <div class="box center"><small class="note">${dlabel(t)} · 풀이 시간 ${time}</small><div class="big">${g.mode==='speed'?c+'개':(n?Math.round(c/n*100):0)+'점'}</div><p class="note">${n}문제 중 ${c}개 정답 (틀린 문제 다시 풀기 포함)</p></div>
    <div class="earnbox">${avatarSVG(p.eq,56)}<div><b>+${g.earned||0} 캐시</b><small>지금 ${p.cash}캐시 ${gradeChip(p.xp)}</small></div><button class="gbtn" id="toShop">꾸미기</button></div>
    <div class="grid3"><div class="cell"><b>${wrong.length}</b><span>내일 다시 나올 오답</span></div><div class="cell"><b>${g.passedNow.length}</b><span>통과한 단계</span></div><div class="cell"><b>${p.streak}/${GOAL}</b><span>지금 단계 연속</span></div></div>

    ${rv.length?`<div class="box"><h3>단계 복습 결과</h3><div class="list">${rv.map(([id,r])=>`<div><span>${STAGES[IDX[id]].name}</span><span>${r.w?`<span class="x">✕${r.w}</span> → 3일 뒤`:'다 맞음 → 5일 뒤'}</span></div>`).join('')}</div></div>`:''}

  </div>
  <div class="dim" id="dlg"><div class="dialog" role="dialog" aria-labelledby="dt"><h3 id="dt">${LI('bell')}알림</h3><p>${g.mode==='speed'?`60초 동안 <b>${c}문제</b>를 맞혔어요.${g.best?'<br>최고 기록이에요! +5캐시':''}<br>`:'문제풀이가 끝났습니다.<br>'}문제풀이 시간: <b>${time}</b><br>정답: <b>${c} / ${n}</b>${wrong.length&&g.mode!=='speed'?`<br>틀린 ${wrong.length}문제는 내일 다시 나와요.`:''}<br>받은 캐시: <b>+${g.earned||0}</b>${g.bonusDay?' (오늘 학습 완료 +10 포함)<br>스피드 게임이 열렸어요!':''}${g.extraPlay?'<br>오답을 끝내서 스피드 게임 +1판!':''}${g.mode==='speed'?`<br>오늘 남은 게임 ${gameLeft(p)}판`:''}</p><button id="dok">확인</button></div></div>`;
  screen.querySelector('#dok').onclick=()=>screen.querySelector('#dlg').remove();
  screen.querySelector('#home').onclick=()=>setTab('home');
  screen.querySelector('#cards').onclick=()=>setTab('cards');
  screen.querySelector('#toShop').onclick=()=>setTab('shop');
  screen.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>openConcept(b.dataset.q,()=>setTab('cards')));
}
