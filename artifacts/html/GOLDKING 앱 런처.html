<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GOLDKING 앱 런처</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;500;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>
/* 레이아웃: 에이전시 포트폴리오 구조(상단 내비 → 대표작 슬라이더 → Works 3열 그리드 + 더보기 → 메모 카드 → 어두운 CTA 푸터), 디자인 시스템은 음악 스트리밍 흰색 테마 */
:root{
  color-scheme:light;
  --bg:#ffffff; --band:#f3f3f3; --tile:#f3f3f3; --tile-hover:#e9e9e9; --line:#e4e4e4;
  --fg:#121212; --muted:#6a6a6a; --soft:#b3b3b3;
  --accent:#ff6b1a; --accent-press:#e85a0c; --accent-ink:#ffffff; --accent-text:#c24f00;
  --live:#118a3e; --dev:#a35c00; --plan:#5b6478; --hold:#8f8f8f; --danger:#d0213f;
  --night:#121212; --night-2:#1f1f1f; --night-fg:#ffffff; --night-muted:#a7a7a7;
  --font-display:"Figtree","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR","Figtree","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --nav-h:64px;
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.lucide{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* 상단 내비 */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.nav .in{height:var(--nav-h);display:flex;align-items:center;gap:20px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:-.02em;flex:none}
.logo .mark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.logo .mark svg{width:16px;height:16px}
.logo small{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:0}
.links{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.links::-webkit-scrollbar{display:none}
.links button{font:inherit;font-family:var(--font-display),var(--font-body);font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;padding:8px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.links button:hover{color:var(--fg)}
.links button.cur{color:var(--fg)}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--tile)}
.iconbtn.on{background:var(--fg);color:var(--bg)}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:999px;padding:0 14px;height:38px;border:2px solid transparent;width:190px}
.searchbox:focus-within{border-color:var(--fg);background:var(--bg)}
.searchbox svg{color:var(--muted);width:16px;height:16px}
.searchbox input{font:inherit;font-size:13px;border:0;background:transparent;outline:none;width:100%;min-width:0;color:var(--fg)}
.btn{font:inherit;font-family:var(--font-display),var(--font-body);font-size:14px;font-weight:800;border-radius:999px;padding:10px 18px;border:1px solid var(--soft);background:var(--bg);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;transition:transform .12s,background .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--fg);transform:scale(1.03)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-press);border-color:var(--accent-press)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn svg{width:16px;height:16px}
@media (max-width:860px){.links{display:none}.tools{margin-left:auto}.searchbox{width:150px}}
@media (max-width:520px){.searchbox{display:none}.btn.add-top span{display:none}.btn.add-top{padding:10px}.logo small{display:none}}

/* 대표작 슬라이더 */
.hero{background:var(--band);overflow:hidden}
.hero .in{padding-block:48px 28px}
.slide{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:center;min-height:300px}
.slide .txt{min-width:0}
.kicker{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.kicker svg{width:15px;height:15px;color:var(--accent-text)}
.slide h1{font-family:var(--font-display),var(--font-body);font-weight:900;font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-.03em;margin:12px 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.slide p{color:var(--muted);font-size:16px;margin:0 0 22px;max-width:42ch}
.slide .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slide .cover{aspect-ratio:16/10;border-radius:10px}
.slide .cover .big{font-size:clamp(46px,8vw,96px)}
.slide.enter .txt>*{animation:rise .5s both}
.slide.enter .txt>*:nth-child(2){animation-delay:.05s}.slide.enter .txt>*:nth-child(3){animation-delay:.1s}.slide.enter .txt>*:nth-child(4){animation-delay:.15s}
.slide.enter .cover{animation:fade .6s both}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:.3;transform:scale(.98)}to{opacity:1;transform:none}}
.hero-ctrl{display:flex;align-items:center;gap:14px;margin-top:30px}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--soft);background:var(--bg);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.arrow:hover{border-color:var(--fg)}
.arrow svg{width:16px;height:16px}
.track{flex:1;height:2px;background:var(--line);border-radius:2px;position:relative;overflow:hidden;min-width:40px}
.track i{position:absolute;inset:0 auto 0 0;background:var(--fg);border-radius:2px;transition:width .4s}
.count{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
@media (max-width:760px){.slide{grid-template-columns:1fr;gap:22px;min-height:0}.slide .cover{order:-1}.hero .in{padding-block:24px 20px}}

/* 섹션 공통 */
.sec{padding-block:72px}
.sec-title{text-align:center;font-family:var(--font-display),var(--font-body);font-size:clamp(26px,3.6vw,34px);font-weight:300;letter-spacing:-.02em;margin:0}
.sec-title b{font-weight:900}
.sec-sub{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 0;font-variant-numeric:tabular-nums}

/* 필터 칩 */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:26px 0 30px}
.chips button{font:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;border:0;background:var(--tile);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button:hover{background:var(--tile-hover)}
.chips button.cur{background:var(--fg);color:var(--bg)}
.chips button small{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chips svg{width:14px;height:14px}

/* Works 그리드 */
.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 14px}
@media (max-width:900px){.works{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.works{grid-template-columns:1fr}}
.work{position:relative;min-width:0}
.work a.open{display:block;text-decoration:none;color:inherit;border-radius:8px}
.cover{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:6px;overflow:hidden;background:var(--c1);color:#fff;isolation:isolate}
.cover::before{content:"";position:absolute;width:80%;aspect-ratio:1;border-radius:50%;background:var(--c2);right:-22%;bottom:-48%;z-index:-1}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(0,0,0,.22));z-index:-1}
.cover .cat-ic{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;opacity:.92}
.cover .cat-ic svg{width:15px;height:15px}
.cover .big{position:absolute;left:16px;right:16px;bottom:12px;font-family:var(--font-display),var(--font-body);font-weight:900;font-size:clamp(26px,3vw,34px);line-height:1.05;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.18);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cover.dim{filter:grayscale(.6)}
.cover img.shot{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;object-position:top center;z-index:0;background:var(--tile)}
.cover.has-shot::before,.cover.has-shot::after{display:none}
.cover.has-shot .big{display:none}
.cover.has-shot{background:var(--tile);box-shadow:inset 0 0 0 1px var(--line)}
.cover.has-shot .cat-ic{z-index:1;background:rgba(18,18,18,.72);padding:4px 9px;border-radius:999px;left:10px;top:10px}
.cover .veil,.cover .nolinktag{z-index:2}
.veil{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;transition:opacity .2s}
.veil span{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display),var(--font-body);font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;transform:translateY(6px);transition:transform .2s}
.veil.add span{background:#fff;color:var(--fg)}
.veil svg{width:16px;height:16px}
.work a.open:hover .veil,.work a.open:focus-visible .veil{opacity:1}
.work a.open:hover .veil span,.work a.open:focus-visible .veil span{transform:none}
.nolinktag{position:absolute;right:12px;bottom:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.92);color:var(--fg);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.nolinktag svg{width:12px;height:12px}
.cap{text-align:center;padding:12px 6px 0}
.cap .nm{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:5px;max-width:100%}
.cap .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .nm svg{width:14px;height:14px;color:var(--accent-text)}
.cap .ds{color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:4px}
.cap .st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-live{color:var(--live)}.st-dev{color:var(--dev)}.st-plan{color:var(--plan)}.st-hold{color:var(--hold)}
.edit{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:var(--fg);display:grid;place-items:center;cursor:pointer;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.edit svg{width:15px;height:15px}
.edit:hover{transform:scale(1.07)}
@media (hover:hover){.work .edit{opacity:0}.work:hover .edit,.work .edit:focus-visible,body.editing .work .edit{opacity:1}}
.more{display:flex;justify-content:center;margin-top:46px}
.more button{width:56px;height:56px;border-radius:50%;border:1px solid var(--soft);background:var(--bg);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:transform .15s,border-color .15s}
.more button:hover{border-color:var(--fg);transform:rotate(90deg)}
.more button svg{width:24px;height:24px;stroke-width:1.5}

/* 팔레트 */
.p0{--c1:#e13300;--c2:#ff8a3d}.p1{--c1:#1e3264;--c2:#4f7cff}.p2{--c1:#148a08;--c2:#7ed957}.p3{--c1:#8d67ab;--c2:#e8a0ff}
.p4{--c1:#e8115b;--c2:#ff7aa8}.p5{--c1:#0d73ec;--c2:#5fd3ff}.p6{--c1:#503750;--c2:#c4567a}.p7{--c1:#bc5900;--c2:#f6c64d}
.p8{--c1:#006450;--c2:#2bd4a4}.p9{--c1:#477d95;--c2:#a8d8e8}.p10{--c1:#af2896;--c2:#ff6bd6}.p11{--c1:#27856a;--c2:#d7f27d}

/* 메모 카드 */
.notes-sec{background:var(--band)}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:36px}
@media (max-width:900px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.notes{grid-template-columns:1fr}}
.note{background:var(--bg);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 2px 14px rgba(0,0,0,.05);cursor:pointer;text-align:left;font:inherit;color:inherit;border:0}
.note:hover{box-shadow:0 8px 26px rgba(0,0,0,.1)}
.note .cover{aspect-ratio:16/7}
.note .cover .big{font-size:22px}
.note h3{margin:0;font-size:16px;font-weight:700;text-align:center}
.note p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note time{font-size:12px;color:var(--soft);text-align:center;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}

/* 푸터 */
footer{background:var(--night);color:var(--night-fg)}
footer .in{padding-block:64px 40px}
.cta{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:40px;border-bottom:1px solid #2a2a2a}
.cta h2{margin:0;font-size:clamp(22px,3vw,28px);font-weight:700;line-height:1.35}
.cta-btn{font:inherit;font-family:var(--font-display),var(--font-body);font-weight:900;font-size:clamp(30px,5vw,48px);letter-spacing:-.02em;background:none;border:0;color:var(--night-fg);display:inline-flex;align-items:center;gap:14px;cursor:pointer;padding:0}
.cta-btn svg{width:36px;height:36px;color:var(--accent);transition:transform .2s}
.cta-btn:hover svg{transform:translateX(6px)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;padding-top:28px;color:var(--night-muted);font-size:13px}
.foot .logo{color:var(--night-fg)}
.foot .logo small{color:var(--night-muted)}
.fstats{display:flex;flex-wrap:wrap;gap:8px}
.fstats span{background:var(--night-2);border-radius:6px;padding:8px 12px;font-variant-numeric:tabular-nums}
.fstats b{color:var(--night-fg);margin-left:4px}

.empty{text-align:center;color:var(--muted);padding:44px 16px;background:var(--tile);border-radius:12px}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}
.notice{margin-top:16px;font-size:13px;color:var(--muted);background:var(--tile);border-radius:10px;padding:10px 14px}

/* 편집 시트 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:grid;place-items:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--bg);color:var(--fg);border-radius:12px;width:100%;max-width:480px;max-height:calc(100% - 32px);overflow:auto;padding:24px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet h3{margin:0;font-family:var(--font-display),var(--font-body);font-weight:900;font-size:22px}
.hint{font-size:13px;background:var(--tile);border-left:3px solid var(--accent);border-radius:4px;padding:8px 10px;margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--soft);border-radius:6px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.field textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:16px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.sheet-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sheet-actions .right{display:flex;gap:8px;margin-left:auto}
.confirm{font-size:13px;color:var(--danger);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#2e77d0;color:#fff;font-size:14px;font-weight:500;padding:10px 18px;border-radius:8px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.2)}
</style>

<header class="nav">
  <div class="in">
    <a class="logo" href="#top" id="logo"><span class="mark"><i data-lucide="layout-grid"></i></span>GOLDKING <small>앱 런처</small></a>
    <nav class="links" id="links" aria-label="카테고리"></nav>
    <div class="tools">
      <label class="searchbox"><i data-lucide="search"></i><input id="q" type="search" placeholder="앱 검색" aria-label="앱 검색"></label>
      <button class="iconbtn" id="editToggle" type="button" hidden aria-label="편집 모드" title="편집 모드"><i data-lucide="pencil"></i></button>
      <button class="btn primary add-top" id="addBtn" type="button" hidden><i data-lucide="plus"></i><span>앱 추가</span></button>
    </div>
  </div>
</header>

<section class="hero" id="top" aria-label="고정한 앱">
  <div class="in">
    <div id="slide" class="slide">
      <div class="txt">
        <span class="kicker"><i data-lucide="layout-grid"></i>GOLDKING 앱 런처</span>
        <h1>앱 목록을 불러오는 중</h1>
        <p>잠시 후 고정한 앱이 여기에 나타나요.</p>
      </div>
      <div class="cover p1"><div class="big">GOLDKING</div></div>
    </div>
    <div class="hero-ctrl" id="heroCtrl" hidden>
      <button class="arrow" id="prev" type="button" aria-label="이전 앱"><i data-lucide="chevron-left"></i></button>
      <button class="arrow" id="next" type="button" aria-label="다음 앱"><i data-lucide="chevron-right"></i></button>
      <div class="track"><i id="bar"></i></div>
      <span class="count" id="count"></span>
    </div>
  </div>
</section>

<section class="sec" id="works">
  <div class="in">
    <h2 class="sec-title">GOLDKING <b>Works</b></h2>
    <p class="sec-sub" id="sub"></p>
    <div class="chips" id="chips"></div>
    <div id="notice"></div>
    <div class="works" id="grid"></div>
    <div class="more" id="more" hidden><button type="button" id="moreBtn" aria-label="앱 더 보기"><i data-lucide="plus"></i></button></div>
  </div>
</section>

<section class="sec notes-sec" id="notesSec" hidden>
  <div class="in">
    <h2 class="sec-title">다음에 <b>수정할 것</b></h2>
    <p class="sec-sub">카드를 누르면 메모를 고칠 수 있어요</p>
    <div class="notes" id="notes"></div>
  </div>
</section>

<footer>
  <div class="in">
    <div class="cta">
      <h2>새로 만든 앱을<br>여기에 모아 두세요</h2>
      <button class="cta-btn" id="ctaAdd" type="button">앱 추가 <i data-lucide="arrow-right"></i></button>
    </div>
    <div class="foot">
      <span class="logo"><span class="mark"><i data-lucide="layout-grid"></i></span>GOLDKING <small>앱 런처</small></span>
      <div class="fstats" id="fstats"></div>
    </div>
  </div>
</footer>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <div class="sheet-head"><h3 id="formTitle">앱 수정</h3><button class="iconbtn" type="button" id="closeBtn" aria-label="닫기"><i data-lucide="x"></i></button></div>
    <div class="hint" id="hint" hidden>아직 링크가 없는 앱이에요. 배포 주소나 저장소 주소를 넣고 저장하면 카드를 눌러 바로 열 수 있어요.</div>
    <div class="field"><label for="f-name">앱 이름</label><input id="f-name" required maxlength="60"></div>
    <div class="row2">
      <div class="field"><label for="f-cat">카테고리</label><input id="f-cat" list="catList" required maxlength="30"><datalist id="catList"></datalist></div>
      <div class="field"><label for="f-status">상태</label>
        <select id="f-status"><option value="live">운영중</option><option value="dev">개발중</option><option value="plan">기획</option><option value="hold">보류</option></select></div>
    </div>
    <div class="field"><label for="f-url">링크 (비워두면 링크 없음)</label><input id="f-url" type="url" placeholder="https://"></div>
    <div class="field"><label for="f-desc">한 줄 설명</label><input id="f-desc" maxlength="120"></div>
    <div class="field"><label for="f-todo">다음에 수정할 것</label><textarea id="f-todo" maxlength="300" placeholder="예: 모바일 조작 버튼 크기 키우기"></textarea></div>
    <label class="check"><input type="checkbox" id="f-pin"> 맨 위 대표 슬라이드에 고정</label>
    <div class="sheet-actions">
      <div id="delArea"></div>
      <div class="right"><button class="btn" type="button" id="cancelBtn">취소</button><button class="btn primary" type="submit" id="saveBtn"><i data-lucide="check"></i>저장</button></div>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const CAT_ORDER=["웹 서비스","학습·교육","액션·3D 게임","대전 게임","도구·대시보드","디자인 시안"];
  const CAT_ICON={"웹 서비스":"globe","학습·교육":"graduation-cap","액션·3D 게임":"crosshair","대전 게임":"swords","도구·대시보드":"wrench","디자인 시안":"palette"};
  const STATUS={live:["운영중","st-live"],dev:["개발중","st-dev"],plan:["기획","st-plan"],hold:["보류","st-hold"]};
  const PAGE=12;
  let apps=[], db=null, canWrite=false, editingId=null, query="", cat="all", shown=PAGE;
  let heroList=[], heroIdx=0, heroTimer=null, heroHover=false;
  const $=id=>document.getElementById(id);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function ic(name){const i=document.createElement("i");i.setAttribute("data-lucide",name);return i}
  function icons(){try{window.lucide&&lucide.createIcons({attrs:{"stroke-width":2}})}catch(e){}}
  function hash(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h}
  function catIcon(c){return CAT_ICON[c]||"folder"}
  function categories(list){
    const set=new Set(list.map(a=>a.cat||"기타"));
    const known=CAT_ORDER.filter(c=>set.has(c));
    const extra=[...set].filter(c=>!CAT_ORDER.includes(c)).sort((a,b)=>a.localeCompare(b,"ko"));
    return [...known,...extra];
  }
  function catRank(c){const i=CAT_ORDER.indexOf(c);return i<0?99:i}
  function sortApps(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||(a.order??999)-(b.order??999)||String(a.name).localeCompare(String(b.name),"ko")}
  function sortAll(a,b){return catRank(a.cat||"기타")-catRank(b.cat||"기타")||String(a.cat).localeCompare(String(b.cat),"ko")||sortApps(a,b)}

  function cover(a,cls){
    const c=el("div","cover p"+(hash(a.id||a.name)%12)+(a.status==="hold"?" dim":"")+(cls?" "+cls:""));
    const t=el("div","cat-ic");t.append(ic(catIcon(a.cat)),document.createTextNode(a.cat||"기타"));
    c.append(t,el("div","big",a.name||"이름 없음"));
    if(a.img){const im=el("img","shot");im.alt="";im.loading="lazy";im.src=a.img;im.addEventListener("error",()=>{im.remove();c.classList.remove("has-shot")});c.classList.add("has-shot");c.prepend(im)}
    return c;
  }
  function wireLink(link,a){
    if(a.url){link.href=a.url;link.target="_blank";link.rel="noopener"}
    else{link.href="#";link.setAttribute("aria-label",(a.name||"앱")+" 링크 추가");link.addEventListener("click",e=>{e.preventDefault();if(canWrite)openForm(a,true);else toast("아직 링크가 없는 앱이에요")})}
  }

  /* 대표 슬라이더 */
  function heroRender(anim){
    const s=$("slide");s.textContent="";s.className="slide";
    if(!heroList.length){$("heroCtrl").hidden=true;
      const t=el("div","txt");const k=el("span","kicker");k.append(ic("layout-grid"),document.createTextNode("GOLDKING 앱 런처"));
      t.append(k,el("h1",null,apps.length?"고정한 앱이 없어요":"아직 등록된 앱이 없어요"),el("p",null,canWrite?"앱 카드의 연필 버튼에서 ‘대표 슬라이드에 고정’을 켜면 여기에 나와요.":"앱이 등록되면 여기에 나와요."));
      s.append(t,cover({name:"GOLDKING",cat:"웹 서비스",id:"x"}));icons();return}
    heroIdx=(heroIdx+heroList.length)%heroList.length;
    const a=heroList[heroIdx];
    const t=el("div","txt");
    const k=el("span","kicker");k.append(ic(catIcon(a.cat)),document.createTextNode(a.cat||"기타"));
    const row=el("div","row");
    if(a.url){const o=el("a","btn primary");o.href=a.url;o.target="_blank";o.rel="noopener";o.append(ic("arrow-up-right"),document.createTextNode("열기"));row.appendChild(o)}
    else if(canWrite){const o=el("button","btn primary");o.type="button";o.append(ic("link"),document.createTextNode("링크 추가"));o.addEventListener("click",()=>openForm(a,true));row.appendChild(o)}
    if(canWrite){const e=el("button","btn");e.type="button";e.append(ic("pencil"),document.createTextNode("수정"));e.addEventListener("click",()=>openForm(a));row.appendChild(e)}
    t.append(k,el("h1",null,a.name||"이름 없음"),el("p",null,a.desc||STATUS[a.status]?.[0]||""),row);
    const cv=a.url?el("a"):el("div");if(a.url){cv.href=a.url;cv.target="_blank";cv.rel="noopener";cv.setAttribute("aria-label",a.name+" 열기")}
    cv.appendChild(cover(a));cv.firstChild.style.borderRadius="10px";
    s.append(t,cv);
    if(anim&&!reduce){void s.offsetWidth;s.classList.add("enter")}
    $("heroCtrl").hidden=heroList.length<2;
    $("bar").style.width=((heroIdx+1)/heroList.length*100)+"%";
    $("count").textContent=String(heroIdx+1).padStart(2,"0")+" / "+String(heroList.length).padStart(2,"0");
    icons();
  }
  function heroGo(d){heroIdx+=d;heroRender(true);heroRestart()}
  function heroRestart(){clearInterval(heroTimer);if(reduce||heroList.length<2)return;heroTimer=setInterval(()=>{if(!heroHover&&$("overlay").hidden){heroIdx++;heroRender(true)}},6000)}
  $("prev").addEventListener("click",()=>heroGo(-1));
  $("next").addEventListener("click",()=>heroGo(1));
  $("top").addEventListener("mouseenter",()=>heroHover=true);
  $("top").addEventListener("mouseleave",()=>heroHover=false);

  /* Works */
  function work(a){
    const w=el("div","work");
    const link=el("a","open");wireLink(link,a);
    const cv=cover(a);
    const v=el("div","veil"+(a.url?"":" add"));const vs=el("span");
    if(a.url)vs.append(ic("arrow-up-right"),document.createTextNode("열기"));
    else vs.append(ic("link"),document.createTextNode(canWrite?"링크 추가":"링크 없음"));
    v.appendChild(vs);cv.appendChild(v);
    if(!a.url){const tg=el("span","nolinktag");tg.append(ic("link-2-off"),document.createTextNode("링크 없음"));cv.appendChild(tg)}
    const cap=el("div","cap");
    const nm=el("div","nm");if(a.pinned)nm.appendChild(ic("pin"));nm.appendChild(el("span",null,a.name||"이름 없음"));
    cap.appendChild(nm);
    if(a.desc)cap.appendChild(el("div","ds",a.desc));
    const st=STATUS[a.status]||STATUS.dev;cap.appendChild(el("span","st "+st[1],st[0]));
    link.append(cv,cap);w.appendChild(link);
    if(canWrite){const b=el("button","edit");b.type="button";b.setAttribute("aria-label",(a.name||"앱")+" 정보 수정");b.appendChild(ic("pencil"));b.addEventListener("click",()=>openForm(a));w.appendChild(b)}
    return w;
  }
  function setCat(c,scroll){cat=c;shown=PAGE;render();if(scroll)$("works").scrollIntoView({block:"start"})}

  function render(){
    const q=query.trim().toLowerCase();
    const matchQ=a=>!q||[a.name,a.desc,a.cat,a.todo,a.url].join(" ").toLowerCase().includes(q);
    const cats=categories(apps);
    // 내비·칩
    const links=$("links");links.textContent="";
    const chips=$("chips");chips.textContent="";
    const mk=(label,val,iconName,n)=>{
      const b=el("button",cat===val?"cur":null);b.type="button";
      if(iconName)b.appendChild(ic(iconName));b.appendChild(document.createTextNode(label));
      if(n!=null)b.appendChild(el("small",null,String(n)));
      b.addEventListener("click",()=>setCat(val,false));chips.appendChild(b);
      const l=el("button",cat===val?"cur":null,label);l.type="button";l.addEventListener("click",()=>setCat(val,true));links.appendChild(l);
    };
    mk("전체","all","layout-grid",apps.length);
    cats.forEach(c=>mk(c,c,catIcon(c),apps.filter(a=>(a.cat||"기타")===c).length));
    // 그리드
    const list=apps.filter(a=>(cat==="all"||(a.cat||"기타")===cat)&&matchQ(a)).sort(sortAll);
    const grid=$("grid");grid.textContent="";
    list.slice(0,shown).forEach(a=>grid.appendChild(work(a)));
    $("more").hidden=list.length<=shown;
    $("sub").textContent=(cat==="all"?"전체":cat)+" "+list.length+"개"+(q?" · ‘"+query.trim()+"’ 검색 결과":"");
    if(!list.length){const e=el("div","empty");e.style.gridColumn="1/-1";
      if(apps.length){e.appendChild(el("strong",null,"맞는 앱이 없어요"));e.appendChild(document.createTextNode("다른 카테고리나 검색어로 찾아보세요."))}
      else{e.appendChild(el("strong",null,"아직 등록된 앱이 없어요"));e.appendChild(document.createTextNode(canWrite?"‘앱 추가’로 첫 앱을 등록하세요.":"앱 목록이 아직 비어 있어요."))}
      grid.appendChild(e)}
    // 메모
    const withTodo=apps.filter(a=>a.todo).sort((a,b)=>String(b.updated||"").localeCompare(String(a.updated||""))||sortAll(a,b));
    const notes=$("notes");notes.textContent="";
    withTodo.slice(0,6).forEach(a=>{
      const n=el("button","note");n.type="button";
      n.append(cover(a),el("h3",null,a.name),el("p",null,a.todo));
      if(a.updated)n.appendChild(el("time",null,a.updated.replaceAll("-","/")));
      n.addEventListener("click",()=>{if(canWrite)openForm(a);else if(a.url)window.open(a.url,"_blank","noopener")});
      notes.appendChild(n)});
    $("notesSec").hidden=!withTodo.length;
    // 푸터 통계
    const fs=$("fstats");fs.textContent="";
    [["전체",apps.length],["운영중",apps.filter(a=>a.status==="live").length],["개발중",apps.filter(a=>a.status==="dev").length],["링크 없음",apps.filter(a=>!a.url).length]].forEach(([l,n])=>{const s=el("span",null,l);s.appendChild(el("b",null,String(n)));fs.appendChild(s)});
    // 데이터리스트
    const dl=$("catList");dl.textContent="";new Set([...CAT_ORDER,...apps.map(a=>a.cat).filter(Boolean)]).forEach(c=>{const o=el("option");o.value=c;dl.appendChild(o)});
    icons();
  }

  function refreshHero(){
    const cur=heroList[heroIdx]?.id;
    heroList=apps.filter(a=>a.pinned).sort(sortApps);
    const i=heroList.findIndex(a=>a.id===cur);heroIdx=i<0?0:i;
    heroRender(false);heroRestart();
  }

  function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

  /* 편집 */
  function openForm(a,needLink){
    if(!canWrite)return;
    editingId=a?a.id:null;
    $("hint").hidden=!needLink;
    $("formTitle").textContent=a?"앱 정보 수정":"새 앱 추가";
    $("f-name").value=a?.name||"";$("f-cat").value=a?.cat||(cat!=="all"?cat:"");$("f-status").value=a?.status||"dev";
    $("f-url").value=a?.url||"";$("f-desc").value=a?.desc||"";$("f-todo").value=a?.todo||"";$("f-pin").checked=!!a?.pinned;
    resetDel();$("delArea").hidden=!a;
    $("overlay").hidden=false;setTimeout(()=>$(needLink?"f-url":"f-name").focus(),0);
  }
  function closeForm(){$("overlay").hidden=true;editingId=null}
  function resetDel(){const d=$("delArea");d.textContent="";const b=el("button","btn danger");b.type="button";b.append(ic("trash-2"),document.createTextNode("삭제"));b.addEventListener("click",askDel);d.appendChild(b);icons()}
  function askDel(){
    const d=$("delArea");d.textContent="";const w=el("div","confirm");w.appendChild(el("span",null,"정말 삭제할까요?"));
    const y=el("button","btn danger","삭제");y.type="button";y.addEventListener("click",doDel);
    const n=el("button","btn","아니요");n.type="button";n.addEventListener("click",resetDel);
    w.append(y,n);d.appendChild(w);
  }
  async function doDel(){
    if(!editingId)return;const name=$("f-name").value;
    try{await db.collection("apps").doc(editingId).delete();closeForm();toast("‘"+name+"’ 삭제됨")}catch(e){toast("삭제하지 못했어요: "+(e?.message||"다시 시도해 주세요"))}
  }
  $("form").addEventListener("submit",async e=>{
    e.preventDefault();if(!db)return;
    const today=new Date().toISOString().slice(0,10);
    const data={name:$("f-name").value.trim(),cat:$("f-cat").value.trim()||"기타",status:$("f-status").value,url:$("f-url").value.trim(),desc:$("f-desc").value.trim(),todo:$("f-todo").value.trim(),pinned:$("f-pin").checked,updated:today};
    const btn=$("saveBtn");btn.disabled=true;
    try{
      if(editingId){await db.collection("apps").doc(editingId).update(data)}
      else{data.order=999;await db.collection("apps").add(data)}
      closeForm();toast("저장됨");
    }catch(err){
      if(err?.code==="invalid_argument"){canWrite=false;applyWrite();toast("이 화면에서는 수정 권한이 없어요")}
      else toast("저장하지 못했어요: "+(err?.message||"잠시 후 다시 시도해 주세요"));
    }finally{btn.disabled=false}
  });
  $("cancelBtn").addEventListener("click",closeForm);
  $("closeBtn").addEventListener("click",closeForm);
  $("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeForm()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)closeForm()});
  $("addBtn").addEventListener("click",()=>openForm(null));
  $("ctaAdd").addEventListener("click",()=>{if(canWrite)openForm(null);else toast("이 화면에서는 앱을 추가할 수 없어요")});
  $("moreBtn").addEventListener("click",()=>{shown+=PAGE;render()});
  $("logo").addEventListener("click",e=>{e.preventDefault();window.scrollTo({top:0})});
  $("editToggle").addEventListener("click",()=>{const on=document.body.classList.toggle("editing");$("editToggle").classList.toggle("on",on);try{localStorage.setItem("launcher-edit",on?"1":"0")}catch(e){}});
  $("q").addEventListener("input",e=>{query=e.target.value;shown=PAGE;render()});
  try{if(localStorage.getItem("launcher-edit")==="1"){document.body.classList.add("editing");$("editToggle").classList.add("on")}}catch(e){}

  function applyWrite(){$("addBtn").hidden=!canWrite;$("editToggle").hidden=!canWrite;render();heroRender(false)}

  async function start(){
    icons();
    const c=window.claude;
    if(!c||!c.use){showNotice("저장소에 연결되지 않아 앱 목록을 볼 수 없어요. claude.ai에서 열어 주세요.");return}
    const [d,u]=await Promise.all([c.use("db"),c.use("user")]);
    db=d;
    if(!db){showNotice("저장소에 연결되지 않아 앱 목록을 볼 수 없어요. 로그인한 상태로 다시 열어 주세요.");return}
    let w=null;try{w=u?await u.can("data.write"):null}catch(e){}
    canWrite=w!==false;applyWrite();
    db.collection("apps").onSnapshot(snap=>{
      apps=snap.docs.map(s=>Object.assign({id:s.id},s.data()));render();refreshHero();
    },err=>showNotice("앱 목록 연결이 끊겼어요. 페이지를 새로 고쳐 주세요."));
  }
  function showNotice(t){const n=$("notice");n.textContent="";n.appendChild(el("div","notice",t))}
  start();
})();
</script>

</body></html>
